name: E2E Type Workspace Layouts
on:
  pull_request:
    branches: [dev]
    paths:
      - 'prototype/exam-app-0.1.1__index.html'
      - 'tests/type-workspace.e2e.mjs'
      - '.github/workflows/e2e-type-workspace.yml'
  push:
    branches: [dev]
    paths:
      - 'prototype/exam-app-0.1.1__index.html'
      - 'tests/type-workspace.e2e.mjs'
      - '.github/workflows/e2e-type-workspace.yml'

permissions:
  contents: read

jobs:
  type-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve prototype
        run: |
          python3 -m http.server 8765 --directory prototype >/tmp/types.log 2>&1 &
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:8765/exam-app-0.1.1__index.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/types.log
          exit 1
      - name: Validate six layouts, search and active tabs on desktop/mobile
        run: node tests/type-workspace.e2e.mjs
      - name: Upload screenshots and assertions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue56-type-workspace-evidence
          path: |
            prototype/issue56_*.png
            prototype/issue56_type_workspace_e2e.json
          if-no-files-found: warn
