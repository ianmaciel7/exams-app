name: E2E Linked Object Hovercards
on:
  pull_request:
    branches: [dev]
    paths:
      - 'prototype/exam-app-0.1.1__index.html'
      - 'tests/object-link-hovercard.test.mjs'
      - 'tests/object-link-hovercard.e2e.mjs'
      - '.github/workflows/e2e-object-link-hovercards.yml'
  push:
    branches: [dev]
    paths:
      - 'prototype/exam-app-0.1.1__index.html'
      - 'tests/object-link-hovercard.test.mjs'
      - 'tests/object-link-hovercard.e2e.mjs'
      - '.github/workflows/e2e-object-link-hovercards.yml'
permissions:
  contents: read
jobs:
  hovercards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify preview content and accessibility contract
        run: node --test tests/object-link-hovercard.test.mjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve prototype
        run: |
          python3 -m http.server 8765 --directory prototype >/tmp/hovercards.log 2>&1 &
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:8765/exam-app-0.1.1__index.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hovercards.log
          exit 1
      - name: Validate pointer and keyboard hovercards in browser
        run: node tests/object-link-hovercard.e2e.mjs
      - name: Upload screenshots and test manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue57-link-hovercards-evidence
          path: |
            prototype/issue57_relation_*.png
            prototype/issue57_link_hovercard_e2e.json
          if-no-files-found: warn
