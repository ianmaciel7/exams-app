name: E2E Keyboard Pin and Tab Touch Targets
on:
  pull_request:
    branches: [dev]
    paths:
      - 'prototype/exam-app-0.1.1__index.html'
      - 'tests/workspace-tab-keyboard.test.mjs'
      - 'tests/workspace-tab-keyboard.e2e.mjs'
      - '.github/workflows/e2e-keyboard-tab-targets.yml'
  push:
    branches: [dev]
    paths:
      - 'prototype/exam-app-0.1.1__index.html'
      - 'tests/workspace-tab-keyboard.test.mjs'
      - 'tests/workspace-tab-keyboard.e2e.mjs'
      - '.github/workflows/e2e-keyboard-tab-targets.yml'
permissions:
  contents: read
jobs:
  tabs-keyboard-targets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate keyboard pin model
        run: node --test tests/workspace-tab-keyboard.test.mjs tests/right-panel-tabs.test.mjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local prototype
        run: |
          python3 -m http.server 8765 --directory prototype >/tmp/tab-keyboard.log 2>&1 &
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:8765/exam-app-0.1.1__index.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/tab-keyboard.log
          exit 1
      - name: Verify keyboard and target sizes in browser
        run: node tests/workspace-tab-keyboard.e2e.mjs
      - name: Upload screen captures and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue55-workspace-tab-keyboard-evidence
          path: |
            prototype/issue55_keyboard_*.png
            prototype/issue55_keyboard_targets_e2e.json
          if-no-files-found: warn
