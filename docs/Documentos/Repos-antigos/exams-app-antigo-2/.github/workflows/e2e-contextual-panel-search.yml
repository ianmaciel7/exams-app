name: E2E Contextual Panel Search and Resize
on:
  pull_request:
    branches: [dev]
    paths:
      - 'prototype/exam-app-0.1.1__index.html'
      - 'tests/right-panel-explore.test.mjs'
      - 'tests/right-panel-resize.test.mjs'
      - 'tests/right-panel-explore.e2e.mjs'
      - 'tests/right-panel-tab-overflow.e2e.mjs'
      - '.github/workflows/e2e-contextual-panel-search.yml'
permissions:
  contents: read
jobs:
  contextual-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate panel contracts
        run: node --test tests/right-panel-explore.test.mjs tests/right-panel-resize.test.mjs tests/right-panel-tabs.test.mjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Exercise contextual tools, resize and tab overflow in Chromium
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory prototype >/tmp/exams-panel.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/exam-app-0.1.1__index.html -o /dev/null; then break; fi
            sleep 1
          done
          node tests/right-panel-explore.e2e.mjs
          node tests/right-panel-tab-overflow.e2e.mjs
      - name: Upload functional screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contextual-panel-66-evidence
          path: |
            prototype/issue54_explore_e2e.json
            prototype/issue55_tabs_e2e.json
            prototype/issue54_*chromium.png
            prototype/issue55_*chromium.png
            prototype/issue66_*chromium.png
          if-no-files-found: warn
