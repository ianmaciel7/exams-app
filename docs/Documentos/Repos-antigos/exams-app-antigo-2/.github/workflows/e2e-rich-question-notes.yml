name: E2E Rich Question Notes and Linked Graph
on:
  pull_request:
    branches: [dev]
    paths:
      - 'prototype/exam-app-0.1.1__index.html'
      - 'tests/question-rich-notes-graph.test.mjs'
      - 'tests/question-rich-notes-graph.e2e.mjs'
      - '.github/workflows/e2e-rich-question-notes.yml'
  push:
    branches: [dev]
    paths:
      - 'prototype/exam-app-0.1.1__index.html'
      - 'tests/question-rich-notes-graph.test.mjs'
      - 'tests/question-rich-notes-graph.e2e.mjs'
      - '.github/workflows/e2e-rich-question-notes.yml'
permissions:
  contents: read
jobs:
  rich-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate graph notes, isolation and security contracts
        run: node --test tests/question-rich-notes-graph.test.mjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve prototype
        run: |
          python3 -m http.server 8765 --directory prototype >/tmp/notes-graph.log 2>&1 &
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:8765/exam-app-0.1.1__index.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/notes-graph.log
          exit 1
      - name: Verify visual note authoring and graph linking in Chromium
        run: node tests/question-rich-notes-graph.e2e.mjs
      - name: Preserve board evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue72-rich-notes-graph-evidence
          path: |
            prototype/issue72_rich_editor_*.png
            prototype/issue72_linked_note_*.png
            prototype/issue72_rich_notes_graph_e2e.json
          if-no-files-found: warn
