name: E2E Question Pedagogy
on:
  pull_request:
    branches: [dev]
    paths:
      - 'prototype/exam-app-0.1.1__index.html'
      - 'tests/question-pedagogy.e2e.mjs'
      - '.github/workflows/e2e-question-pedagogy.yml'
  push:
    branches: [dev]
    paths:
      - 'prototype/exam-app-0.1.1__index.html'
      - 'tests/question-pedagogy.e2e.mjs'
      - '.github/workflows/e2e-question-pedagogy.yml'

permissions:
  contents: read

jobs:
  pedagogy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve prototype
        run: |
          python3 -m http.server 8765 --directory prototype >/tmp/pedagogy.log 2>&1 &
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:8765/exam-app-0.1.1__index.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pedagogy.log
          exit 1
      - name: Verify real pedagogical journeys
        run: node tests/question-pedagogy.e2e.mjs
      - name: Upload screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue72-pedagogy-evidence
          path: |
            prototype/issue72_*.png
            prototype/issue72_pedagogy_e2e.json
          if-no-files-found: warn
