name: E2E Borderless Object Properties
on:
  pull_request:
    branches: [dev]
    paths:
      - 'prototype/exam-app-0.1.1__index.html'
      - 'tests/object-properties-inline.test.mjs'
      - 'tests/object-properties-inline.e2e.mjs'
      - '.github/workflows/e2e-object-properties-inline.yml'
  push:
    branches: [dev]
    paths:
      - 'prototype/exam-app-0.1.1__index.html'
      - 'tests/object-properties-inline.test.mjs'
      - 'tests/object-properties-inline.e2e.mjs'
      - '.github/workflows/e2e-object-properties-inline.yml'
permissions:
  contents: read
jobs:
  inline-properties:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify property rendering contracts
        run: node --test tests/object-properties-inline.test.mjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local prototype
        run: |
          python3 -m http.server 8765 --directory prototype >/tmp/inline-props.log 2>&1 &
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:8765/exam-app-0.1.1__index.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/inline-props.log
          exit 1
      - name: Validate inline metadata and editing in Chromium
        run: node tests/object-properties-inline.e2e.mjs
      - name: Store screenshots and interaction manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue57-inline-object-properties-evidence
          path: |
            prototype/issue57_inline_properties_*.png
            prototype/issue57_inline_properties_e2e.json
          if-no-files-found: warn
