name: E2E Contextual Right Panel Tabs
on:
  pull_request:
    branches: [dev]
    paths:
      - 'prototype/exam-app-0.1.1__index.html'
      - 'tests/right-panel-tabs.test.mjs'
      - 'tests/right-panel-tabs.e2e.mjs'
      - '.github/workflows/e2e-context-tabs.yml'
  push:
    branches: [dev]
    paths:
      - 'prototype/exam-app-0.1.1__index.html'
      - 'tests/right-panel-tabs.test.mjs'
      - 'tests/right-panel-tabs.e2e.mjs'
      - '.github/workflows/e2e-context-tabs.yml'
permissions:
  contents: read
jobs:
  contextual-tabs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify tab state model
        run: node --test tests/right-panel-tabs.test.mjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start prototype
        run: |
          python3 -m http.server 8765 --directory prototype >/tmp/context-tabs.log 2>&1 &
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:8765/exam-app-0.1.1__index.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/context-tabs.log
          exit 1
      - name: Validate pin, follow, navigation, refresh and screenshots
        run: node tests/right-panel-tabs.e2e.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue55-context-tabs-evidence
          path: |
            prototype/issue55_graph_*.png
            prototype/issue55_graph_e2e.json
          if-no-files-found: warn
