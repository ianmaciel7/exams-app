name: E2E Explicit Question Confirmation
on:
  pull_request:
    branches: [dev]
    paths:
      - 'prototype/exam-app-0.1.1__index.html'
      - 'tests/question-confirm.e2e.mjs'
      - '.github/workflows/e2e-question-confirm.yml'
  push:
    branches: [dev]
    paths:
      - 'prototype/exam-app-0.1.1__index.html'
      - 'tests/question-confirm.e2e.mjs'
      - '.github/workflows/e2e-question-confirm.yml'

permissions:
  contents: read

jobs:
  question-confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start prototype
        run: |
          python3 -m http.server 8765 --directory prototype >/tmp/question-confirm.log 2>&1 &
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:8765/exam-app-0.1.1__index.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/question-confirm.log
          exit 1
      - name: Select, change, confirm, reload and reset
        run: node tests/question-confirm.e2e.mjs
      - name: Publish user-journey screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue71-question-confirm-evidence
          path: |
            prototype/issue71_*.png
            prototype/issue71_confirm_e2e.json
          if-no-files-found: warn
