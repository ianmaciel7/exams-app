name: E2E PDF Triage and Saved Filtered Views
on:
  pull_request:
    branches: [dev]
    paths:
      - 'prototype/exam-app-0.1.1__index.html'
      - 'tests/reader-triage-filtered-views.test.mjs'
      - 'tests/reader-triage-filtered-views.e2e.mjs'
      - '.github/workflows/e2e-reader-triage.yml'
  push:
    branches: [dev]
    paths:
      - 'prototype/exam-app-0.1.1__index.html'
      - 'tests/reader-triage-filtered-views.test.mjs'
      - 'tests/reader-triage-filtered-views.e2e.mjs'
      - '.github/workflows/e2e-reader-triage.yml'
permissions:
  contents: read
jobs:
  reader-triage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate reader triage and query domain contracts
        run: node --test tests/reader-triage-filtered-views.test.mjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start prototype
        run: |
          python3 -m http.server 8765 --directory prototype >/tmp/reader-triage.log 2>&1 &
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:8765/exam-app-0.1.1__index.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/reader-triage.log
          exit 1
      - name: Verify actual Inbox, Later, Shortlist, Archive and filtered views
        run: node tests/reader-triage-filtered-views.e2e.mjs
      - name: Archive screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue81-reader-triage-evidence
          path: |
            prototype/issue81_*.png
            prototype/issue81_reader_triage_e2e.json
          if-no-files-found: warn
