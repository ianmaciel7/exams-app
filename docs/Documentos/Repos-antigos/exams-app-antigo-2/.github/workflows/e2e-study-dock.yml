name: E2E Study Dock
on:
  pull_request:
    branches: [dev]
    paths:
      - 'prototype/exam-app-0.1.1__index.html'
      - 'tests/study-dock.e2e.mjs'
      - '.github/workflows/e2e-study-dock.yml'
  push:
    branches: [dev]
    paths:
      - 'prototype/exam-app-0.1.1__index.html'
      - 'tests/study-dock.e2e.mjs'
      - '.github/workflows/e2e-study-dock.yml'

permissions:
  contents: read

jobs:
  study-dock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start prototype
        run: |
          python3 -m http.server 8765 --directory prototype >/tmp/study-dock.log 2>&1 &
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:8765/exam-app-0.1.1__index.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/study-dock.log
          exit 1
      - name: Validate highlighter, timer, focus, font and sheet
        run: node tests/study-dock.e2e.mjs
      - name: Upload screenshots and journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue74-study-dock-evidence
          path: |
            prototype/issue74_*.png
            prototype/issue74_study_dock_e2e.json
          if-no-files-found: warn
