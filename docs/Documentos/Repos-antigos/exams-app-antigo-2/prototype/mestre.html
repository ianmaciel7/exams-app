<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exam App — Central de Boards</title>
<style>
:root{color-scheme:light dark;--bg:#f5f5f2;--panel:#fff;--ink:#242522;--muted:#6c7069;--line:#dedfd8;--accent:#3568b8;--soft:#edf2fa;--shadow:0 1px 3px rgba(0,0,0,.05)}
@media(prefers-color-scheme:dark){:root{--bg:#171816;--panel:#222420;--ink:#eeeee9;--muted:#a7aaa1;--line:#3c4039;--accent:#9bbcf2;--soft:#293343;--shadow:none}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 18px;z-index:5}h1{font-size:19px;margin:0 0 4px}.sub{color:var(--muted);font-size:13px;margin:0 0 10px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}input[type=search],select{padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);font:inherit;min-height:40px}input[type=search]{flex:1 1 260px}
button,a.btn{font:inherit;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);text-decoration:none;min-height:38px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}button[aria-pressed=true]{background:var(--soft);border-color:var(--accent)}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.areas{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}nav.areas button{font-size:13px;min-height:34px;padding:6px 9px}
main{padding:20px;max-width:1440px;margin:0 auto}.map-intro{margin:0 0 16px;padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.map-intro h2{font-size:17px;margin:0 0 4px}.map-intro p{color:var(--muted);margin:0}
.map-hub{display:flex;align-items:center;justify-content:center;margin:18px 0 10px}.map-hub span{padding:10px 18px;border:1px solid var(--accent);border-radius:999px;background:var(--soft);font-weight:650}.map-stem{text-align:center;color:var(--muted);font-size:20px;line-height:1;margin:0 0 12px}
.map-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:12px}.map-card,.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow)}.map-card{display:flex;flex-direction:column;gap:9px;min-height:175px}.map-card h3,.card h3{font-size:15px;margin:0}.map-card p{font-size:13px;color:var(--muted);margin:0}
.map-meta,.meta{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.tag{border:1px solid var(--line);border-radius:999px;padding:2px 8px}.map-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto}
section.area{margin-bottom:30px}section.area h2{font-size:17px;margin:0 0 4px}section.area>p{margin:0 0 10px;color:var(--muted)}.area-actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.docs{margin:12px 0 14px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--panel)}.docs summary{cursor:pointer;font-weight:600;font-size:13px}.docs ul{padding-left:20px;margin:9px 0 2px}.docs li{margin:5px 0;font-size:13px}.docs a,.card a:not(.btn){color:var(--accent)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}.list .grid{grid-template-columns:1fr}.card{display:flex;flex-direction:column;gap:8px}.card .summary{margin:0;font-size:13px;color:var(--muted)}.card-links{display:flex;flex-wrap:wrap;gap:6px}
.empty{color:var(--muted);padding:24px 0}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.err{color:#b4532f}
@media(max-width:600px){header{padding:12px}main{padding:12px}.map-grid,.grid{grid-template-columns:1fr}.bar a.btn{flex:1}}
</style></head><body>
<header><h1 id="ttl">Exam App — Central de Boards</h1><p class="sub">Organizado por assunto e funcionalidade. Documentos e diagramas junto dos blocos relacionados.</p>
<div class="bar"><label class="sr" for="q">Buscar</label><input id="q" type="search" placeholder="Buscar funcionalidade, documento, decisão ou evidência" autocomplete="off">
<label class="sr" for="kind">Tipo</label><select id="kind"><option value="">Todos os tipos</option></select>
<button id="vm" aria-pressed="true" type="button">Mapa</button><button id="vl" aria-pressed="false" type="button">Lista</button><button id="vg" aria-pressed="false" type="button">Galeria</button><button id="vf" aria-pressed="false" type="button">Features</button><a class="btn" href="board-exam-app__index.html">Canvas original</a></div>
<nav class="areas" id="areas" aria-label="Boards temáticos"></nav></header>
<p class="empty" id="status" style="padding:8px 18px 0;margin:0">Carregando…</p><main id="main"></main>
<script>
const $=id=>document.getElementById(id),REPO='https://github.com/ianmaciel7/exams-app/blob/dev/';
let M=null,E={},view='map',area='',kind='',q='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const repoLink=p=>REPO+p;
function snippet(id){const e=E[id];if(!e)return '';const t=(e.text||e.title||'').replace(/[*#>\[\]]/g,'').replace(/\s+/g,' ').trim();return t.length>150?t.slice(0,150)+'…':t}
function allCards(){return M.areas.flatMap(a=>a.cards.map(c=>({...c,area:a})))}
function matches(c){if(area&&c.area.id!==area)return false;if(kind&&c.kind!==kind)return false;if(q){const docs=[...(c.documents||[]),...(c.area.documents||[])].map(d=>d.title+' '+d.path+' '+d.role).join(' ');const hay=[c.name,c.kind,c.summary,c.area.name,c.area.summary,docs,...c.blocks.map(snippet)].join(' ').toLowerCase();if(!hay.includes(q))return false}return true}
function setArea(id){area=id;document.querySelectorAll('#areas button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===id));render()}
function renderMap(){const main=$('main');main.className='';const cards=M.areas.map(a=>{const n=a.cards.reduce((x,c)=>x+c.blocks.length,0);return '<article class="map-card"><div class="meta"><span class="tag">Board '+esc(a.id)+'</span><span class="tag">'+a.cards.length+' grupos</span></div><h3>'+esc(a.name)+'</h3><p>'+esc(a.summary)+'</p><div class="map-meta"><span>'+n+' containers</span><span>'+a.documents.length+' documentos</span></div><div class="map-actions"><a class="btn" href="'+repoLink(a.board)+'" target="_blank" rel="noopener">Abrir diagrama</a><button type="button" data-open-area="'+esc(a.id)+'">Explorar board</button></div></article>'}).join('');main.innerHTML='<section class="map-intro"><h2>Mapa de conhecimento do Exam App</h2><p>Escolha uma área pelo assunto. Cada board abre o diagrama Mermaid, os documentos de referência e os blocos do canvas original.</p><div class="map-hub"><span>Exam App · Board Hub</span></div><div class="map-stem" aria-hidden="true">↓</div><div class="map-grid">'+cards+'</div></section>';main.onclick=e=>{const b=e.target.closest('[data-open-area]');if(b)setArea(b.dataset.openArea)}}
function renderSections(){const main=$('main');main.className=view==='list'?'list':'';let html='';for(const a of M.areas){if(area&&a.id!==area)continue;const cards=a.cards.filter(c=>matches({...c,area:a}));if(!cards.length)continue;const docs=(a.documents||[]).map(d=>'<li><a href="'+repoLink(d.path)+'" target="_blank" rel="noopener">'+esc(d.title)+'</a><span class="meta"> — '+esc(d.role)+'</span></li>').join('');html+='<section class="area" id="area-'+esc(a.id)+'"><h2>'+esc(a.id)+' — '+esc(a.name)+'</h2><p>'+esc(a.summary)+'</p><div class="area-actions"><a class="btn" href="'+repoLink(a.board)+'" target="_blank" rel="noopener">Abrir diagrama deste board</a><a class="btn" href="board-exam-app__index.html">Canvas original</a></div><details class="docs"><summary>Documentos de referência ('+(a.documents||[]).length+')</summary><ul>'+docs+'</ul></details><div class="grid">';for(const c of cards){const cardDocs=(c.documents||[]).map(d=>'<a href="'+repoLink(d.path)+'" target="_blank" rel="noopener">'+esc(d.title)+'</a>').join(' · ');html+='<article class="card" id="grp-'+esc(c.blocks[0])+'"><h3>'+esc(c.name)+'</h3><div class="meta"><span class="tag">'+esc(c.kind)+'</span><span class="tag">'+c.blocks.length+' bloco(s)</span></div><p class="summary">'+esc(c.summary||snippet(c.blocks[0]))+'</p>'+(cardDocs?'<div class="meta">Documentos: '+cardDocs+'</div>':'')+(c.images||[]).map(i=>'<a href="'+esc(i)+'" target="_blank" rel="noopener"><img src="'+esc(i)+'" alt="'+esc(i.split('/').pop())+'" loading="lazy" style="width:100%;border:1px solid var(--line);border-radius:8px"></a>').join('')+'<div class="card-links">'+c.blocks.map(b=>'<a class="btn" href="board-exam-app__index.html#'+esc(b)+'">Abrir '+esc(b)+' no canvas</a>').join(' ')+'</div></article>'}html+='</div></section>'}main.innerHTML=html||'<p class="empty">Nenhum item com esses filtros.</p>'}
function render(){if(view==='features')return;if(view==='map'&&!area&&!q&&!kind)renderMap();else renderSections();const selected=area?M.areas.find(a=>a.id===area):null;const count=allCards().filter(matches).length;$('status').textContent=selected?selected.name+' · '+count+' grupos':count+' grupos · '+M.areas.length+' boards · '+M.areas.reduce((n,a)=>n+a.documents.length,0)+' vínculos de documentos'}
Promise.all([fetch('board-mestre.json').then(r=>{if(!r.ok)throw 0;return r.json()}),fetch('board.json').then(r=>{if(!r.ok)throw 0;return r.json()})]).then(([m,b])=>{M=m;E=b.elements;$('ttl').textContent=m.title;document.title=m.title;const nav=$('areas');nav.innerHTML='<button type="button" data-id="" aria-pressed="true">Todos os boards</button>'+M.areas.map(a=>'<button type="button" data-id="'+esc(a.id)+'" aria-pressed="false">'+esc(a.id)+' '+esc(a.name)+'</button>').join('');nav.onclick=e=>{const b=e.target.closest('button');if(b)setArea(b.dataset.id)};const kinds=[...new Set(allCards().map(c=>c.kind))].sort();$('kind').insertAdjacentHTML('beforeend',kinds.map(s=>'<option value="'+esc(s)+'">'+esc(s)+'</option>').join(''));$('kind').onchange=e=>{kind=e.target.value;render()};$('q').oninput=e=>{q=e.target.value.trim().toLowerCase();render()};$('vm').onclick=()=>{view='map';area='';document.querySelectorAll('#areas button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===''));$('vm').setAttribute('aria-pressed','true');$('vl').setAttribute('aria-pressed','false');$('vg').setAttribute('aria-pressed','false');render()};$('vl').onclick=()=>{view='list';$('vm').setAttribute('aria-pressed','false');$('vl').setAttribute('aria-pressed','true');$('vg').setAttribute('aria-pressed','false');render()};$('vg').onclick=()=>{view='grid';$('vm').setAttribute('aria-pressed','false');$('vg').setAttribute('aria-pressed','true');$('vl').setAttribute('aria-pressed','false');render()};render()}).catch(()=>{$('status').className='err';$('status').textContent='Não foi possível carregar board-mestre.json ou board.json.'});
</script>
<style>
.ev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}.ev{margin:0}.ev img{width:100%;height:110px;object-fit:cover;border:1px solid var(--line);border-radius:8px;display:block}.ev figcaption{font-size:11px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.sec{margin:0 0 18px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}.sec h3{margin:0 0 8px;font-size:15px}.sec ul{padding-left:20px;margin:6px 0}.sec li{margin:4px 0;font-size:13px}
.crumbs{font-size:13px;color:var(--muted);margin:0 0 10px}.crumbs a{color:var(--accent)}.feat-head h2{margin:0 0 6px;font-size:20px}
.diagram{margin:0 0 14px}.diagram figcaption{font-size:13px;margin-bottom:6px}.mermaid-box{overflow:auto;max-width:100%;padding:8px;border:1px dashed var(--line);border-radius:8px}.mermaid-box svg{max-width:100%;height:auto}pre{overflow:auto;font-size:12px;background:var(--bg);padding:8px;border-radius:6px}
.feature{max-width:960px;min-width:0}.feature>*{min-width:0}.feature li,.feature a{overflow-wrap:anywhere}.feature figure,.feature .mermaid-box{min-width:0;max-width:100%}.feature .mermaid-box svg{display:block}.feat-mode nav.areas{display:none}pre code{overflow-wrap:normal}.feature .btn{min-height:38px}
@media(max-width:600px){.sec{padding:10px}}
</style>
<script src="mestre-features.js"></script></body></html>
