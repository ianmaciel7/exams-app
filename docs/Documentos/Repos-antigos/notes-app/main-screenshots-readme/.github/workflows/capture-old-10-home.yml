name: Capture old-10 authenticated home

on:
  push:
    paths:
      - .github/workflows/capture-old-10-home.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out historical app
        uses: actions/checkout@v4
        with:
          ref: old-10
          path: app

      - name: Check out screenshot gallery
        uses: actions/checkout@v4
        with:
          ref: main
          path: gallery

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: app
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare isolated emulators and screenshot test
        working-directory: app
        run: |
          node -e "const fs=require('node:fs'); const p=require('./package.json'); p.scripts.emulators='firebase emulators:start --only auth,firestore --project demo-recall'; fs.writeFileSync('package.json',JSON.stringify(p,null,2));"
          cat > tests/e2e/capture-gallery.spec.ts <<'TS'
          import { expect, test } from "@playwright/test";
          import { createObject, createSpace, signUp } from "./helpers";

          test("capture authenticated old-10 Space Home", async ({ page }) => {
            test.setTimeout(180_000);
            await page.setViewportSize({ width: 1440, height: 900 });
            await signUp(page);
            await createSpace(page, "Study & Notes Space");
            await createObject(page, {
              kind: "note",
              title: "Distributed systems notes",
              text: "Reviewing reliable distributed systems.",
            });
            await createObject(page, {
              kind: "question",
              title: "What is eventual consistency?",
              text: "A distributed systems revision question.",
              options: ["Immediate consistency", "Convergence over time"].join(String.fromCharCode(10)),
              answers: "Convergence over time",
            });
            await page.goto("/space");
            await expect(page.getByRole("heading", { name: "Overview" })).toBeVisible();
            await expect(page.getByText("Recent objects")).toBeVisible();
            await expect(page.getByText("What is eventual consistency?")).toBeVisible();
            await expect(page.locator("aside").first()).toBeVisible();
            await page.screenshot({
              path: "../gallery/screenshots/old-10-home.png",
              fullPage: true,
              animations: "disabled",
            });
          });
          TS

      - name: Capture authenticated Home
        working-directory: app
        env:
          CI: 'true'
          FIREBASE_PROJECT_ID: demo-recall
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-recall
        run: pnpm exec playwright test capture-gallery.spec.ts --project=chromium --workers=1

      - name: Upload captured screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: old-10-authenticated-home
          path: gallery/screenshots/old-10-home.png
          if-no-files-found: ignore

      - name: Commit authentic screenshot to gallery
        working-directory: gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots/old-10-home.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: capture old-10 authenticated Space home"
            git push origin HEAD:main
          fi
