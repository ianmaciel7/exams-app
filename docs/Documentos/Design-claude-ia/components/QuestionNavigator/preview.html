<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font:400 16px/1.55 var(--font-sans);color:var(--body)}
.pane{background:var(--canvas);color:var(--body);padding:20px 24px}
.pane+.pane{border-top:1px solid var(--hairline)}
.tag{font:500 12px/1.4 var(--font-sans);letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:12px}
*:focus-visible,.focus{outline:2px solid var(--primary);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font-family:var(--font-sans);cursor:pointer}
button:disabled{cursor:not-allowed}
.btn{height:40px;padding:0 20px;border-radius:var(--radius-md);border:1px solid transparent;font:500 14px/1 var(--font-sans)}
.btn.p{background:var(--ink);color:var(--canvas)}
.btn.s{background:var(--surface-raised);color:var(--ink);border-color:var(--ring)}
kbd{font:500 11px/16px var(--font-sans);color:var(--muted);border:1px solid var(--hairline);border-radius:6px;padding:0 5px;background:var(--surface-raised)}
.btn.g{background:transparent;color:var(--ink)}
.help{font:400 13px/1.4 var(--font-sans);color:var(--muted);margin-top:6px}
.err{color:var(--error)}
label.l{display:block;font:500 13px/1.4 var(--font-sans);color:var(--ink);margin-bottom:6px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.qn{max-width:360px;padding:16px;border:1px solid var(--hairline);border-radius:var(--radius-lg)}
.qn ol{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;list-style:none;margin:0 0 12px;padding:0}
.qn button{position:relative;width:100%;height:36px;border-radius:var(--radius-md);border:1px solid var(--border-strong);background:var(--surface-raised);color:var(--ink);font:500 14px var(--font-sans);font-variant-numeric:tabular-nums;padding:0}
.qn .a{background:var(--surface-cream-strong)}.qn .cur{border:2px solid var(--ink);font-weight:700}.qn .fl::after{content:"⚑";position:absolute;top:-6px;right:-3px;font-size:11px;background:var(--surface-raised);border-radius:50%;line-height:1}
.qn .ok{background:var(--success-soft);border-color:var(--success)}.qn .no{background:var(--error-soft);border-color:var(--error)}
.qn .leg{font:400 12px/1.5 var(--font-sans);color:var(--muted)}.qn{border-radius:16px;background:var(--surface-raised)}.qn button{border-color:var(--ring)}.qn .cur{border-color:var(--ink)}</style></head><body><div class="pane"><p class="tag">Light</p><nav class="qn" aria-label="Questions"><ol><li><button class="a" aria-label="Question 1, answered">1</button></li><li><button class="a" aria-label="Question 2, answered">2</button></li><li><button class="a fl" aria-label="Question 3, flagged, answered">3</button></li><li><button class="a">4</button></li><li><button class="cur" aria-current="true" aria-label="Question 5, current">5</button></li><li><button class="fl" aria-label="Question 6, flagged">6</button></li><li><button>7</button></li><li><button class="focus">8</button></li><li><button class="ok" aria-label="Question 9, correct">9 ✓</button></li><li><button class="no" aria-label="Question 10, incorrect">10 ✕</button></li><li><button>11</button></li><li><button>12</button></li></ol><div class="leg">Answered, flagged, current, unanswered. 4 answered, 2 flagged, 8 left.</div></nav></div><div class="pane" data-theme="dark"><p class="tag">Dark</p><nav class="qn" aria-label="Questions"><ol><li><button class="a" aria-label="Question 1, answered">1</button></li><li><button class="a" aria-label="Question 2, answered">2</button></li><li><button class="a fl" aria-label="Question 3, flagged, answered">3</button></li><li><button class="a">4</button></li><li><button class="cur" aria-current="true" aria-label="Question 5, current">5</button></li><li><button class="fl" aria-label="Question 6, flagged">6</button></li><li><button>7</button></li><li><button class="focus">8</button></li><li><button class="ok" aria-label="Question 9, correct">9 ✓</button></li><li><button class="no" aria-label="Question 10, incorrect">10 ✕</button></li><li><button>11</button></li><li><button>12</button></li></ol><div class="leg">Answered, flagged, current, unanswered. 4 answered, 2 flagged, 8 left.</div></nav></div></body></html>
