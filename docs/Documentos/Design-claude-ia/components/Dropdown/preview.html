<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font:400 16px/1.55 var(--font-sans);color:var(--body)}
.pane{background:var(--canvas);color:var(--body);padding:20px 24px}
.pane+.pane{border-top:1px solid var(--hairline)}
.tag{font:500 12px/1.4 var(--font-sans);letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:12px}
*:focus-visible,.focus{outline:2px solid var(--primary);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font-family:var(--font-sans);cursor:pointer}
button:disabled{cursor:not-allowed}
.btn{height:40px;padding:0 20px;border-radius:var(--radius-md);border:1px solid transparent;font:500 14px/1 var(--font-sans)}
.btn.p{background:var(--ink);color:var(--canvas)}
.btn.s{background:var(--surface-raised);color:var(--ink);border-color:var(--ring)}
kbd{font:500 11px/16px var(--font-sans);color:var(--muted);border:1px solid var(--hairline);border-radius:6px;padding:0 5px;background:var(--surface-raised)}
.btn.g{background:transparent;color:var(--ink)}
.help{font:400 13px/1.4 var(--font-sans);color:var(--muted);margin-top:6px}
.err{color:var(--error)}
label.l{display:block;font:500 13px/1.4 var(--font-sans);color:var(--ink);margin-bottom:6px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.dd{position:relative;display:inline-block}.tr{display:inline-flex;gap:8px;align-items:center}
.mn{min-width:220px;margin:6px 0 0;padding:4px;list-style:none;background:var(--surface-raised);border:1px solid var(--hairline);border-radius:var(--radius-md);box-shadow:var(--shadow-popover);font:400 14px/1.4 var(--font-sans);color:var(--ink)}
.mn li{display:flex;justify-content:space-between;align-items:center;height:36px;padding:0 10px;border-radius:var(--radius-sm)}
.mn li.hl{background:var(--surface-card)}.mn li.x{color:var(--error)}.mn li.dis{color:var(--muted-soft)}.mn kbd{font:400 12px var(--font-mono);color:var(--muted)}
.mn hr{border:0;border-top:1px solid var(--hairline-soft);margin:4px 0}.mn{border-radius:12px;padding:6px;min-width:240px}.mn li{border-radius:8px}.mn kbd{font:500 11px/16px var(--font-sans)}</style></head><body><div class="pane"><p class="tag">Light</p><div class="dd"><button class="btn s tr" aria-haspopup="menu" aria-expanded="true">More <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg></button><ul class="mn" role="menu"><li role="menuitem" class="hl">Add to notes <kbd>N</kbd></li><li role="menuitem">Flag for review <kbd>F</kbd></li><li role="menuitem" aria-disabled="true" class="dis">Share explanation</li><hr role="separator"><li role="menuitem" class="x">Report a problem</li></ul></div></div><div class="pane" data-theme="dark"><p class="tag">Dark</p><div class="dd"><button class="btn s tr" aria-haspopup="menu" aria-expanded="true">More <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg></button><ul class="mn" role="menu"><li role="menuitem" class="hl">Add to notes <kbd>N</kbd></li><li role="menuitem">Flag for review <kbd>F</kbd></li><li role="menuitem" aria-disabled="true" class="dis">Share explanation</li><hr role="separator"><li role="menuitem" class="x">Report a problem</li></ul></div></div></body></html>
