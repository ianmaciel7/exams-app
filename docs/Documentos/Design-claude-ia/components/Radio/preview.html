<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font:400 16px/1.55 var(--font-sans);color:var(--body)}
.pane{background:var(--canvas);color:var(--body);padding:20px 24px}
.pane+.pane{border-top:1px solid var(--hairline)}
.tag{font:500 12px/1.4 var(--font-sans);letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:12px}
*:focus-visible,.focus{outline:2px solid var(--primary);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font-family:var(--font-sans);cursor:pointer}
button:disabled{cursor:not-allowed}
.btn{height:40px;padding:0 20px;border-radius:var(--radius-md);border:1px solid transparent;font:500 14px/1 var(--font-sans)}
.btn.p{background:var(--ink);color:var(--canvas)}
.btn.s{background:var(--surface-raised);color:var(--ink);border-color:var(--ring)}
kbd{font:500 11px/16px var(--font-sans);color:var(--muted);border:1px solid var(--hairline);border-radius:6px;padding:0 5px;background:var(--surface-raised)}
.btn.g{background:transparent;color:var(--ink)}
.help{font:400 13px/1.4 var(--font-sans);color:var(--muted);margin-top:6px}
.err{color:var(--error)}
label.l{display:block;font:500 13px/1.4 var(--font-sans);color:var(--ink);margin-bottom:6px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.rd{display:flex;align-items:center;gap:10px;font:400 16px/1.4 var(--font-sans);color:var(--ink);min-height:28px}
input[type=radio]{appearance:none;-webkit-appearance:none;margin:0;width:20px;height:20px;border:1.5px solid var(--border-strong);border-radius:50%;background:var(--surface-raised);flex:none}
input[type=radio]:checked{background:var(--primary);border-color:var(--primary);box-shadow:inset 0 0 0 4px var(--surface-raised)}
input[type=radio].h{box-shadow:0 0 0 6px var(--surface-soft)}
input[type=radio]:disabled{background:var(--primary-disabled);border-color:var(--hairline);cursor:not-allowed}
input[type=radio].e{border-color:var(--error)}
fieldset{border:0;margin:0;padding:0}legend{font:500 13px/1.4 var(--font-sans);color:var(--ink);margin-bottom:6px;padding:0}.d{color:var(--muted)}</style></head><body><div class="pane"><p class="tag">Light</p><div class="row" style="gap:32px"><fieldset><legend>Study mode</legend><label class="rd"><input type="radio" name="m" checked> Practice</label><label class="rd"><input type="radio" name="m"> Timed exam</label><label class="rd"><input type="radio" name="m" class="focus"> Review only</label></fieldset>
<fieldset><legend>States</legend><label class="rd"><input type="radio" name="s" class="h"> Hover</label><label class="rd d"><input type="radio" name="s" disabled> Disabled</label><label class="rd"><input type="radio" name="s" class="e" aria-invalid="true"> Error</label></fieldset></div></div><div class="pane" data-theme="dark"><p class="tag">Dark</p><div class="row" style="gap:32px"><fieldset><legend>Study mode</legend><label class="rd"><input type="radio" name="m" checked> Practice</label><label class="rd"><input type="radio" name="m"> Timed exam</label><label class="rd"><input type="radio" name="m" class="focus"> Review only</label></fieldset>
<fieldset><legend>States</legend><label class="rd"><input type="radio" name="s" class="h"> Hover</label><label class="rd d"><input type="radio" name="s" disabled> Disabled</label><label class="rd"><input type="radio" name="s" class="e" aria-invalid="true"> Error</label></fieldset></div></div></body></html>
