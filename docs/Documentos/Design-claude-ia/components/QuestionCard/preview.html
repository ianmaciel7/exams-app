<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font:400 16px/1.55 var(--font-sans);color:var(--body)}
.pane{background:var(--canvas);color:var(--body);padding:20px 24px}
.pane+.pane{border-top:1px solid var(--hairline)}
.tag{font:500 12px/1.4 var(--font-sans);letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:12px}
*:focus-visible,.focus{outline:2px solid var(--primary);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font-family:var(--font-sans);cursor:pointer}
button:disabled{cursor:not-allowed}
.btn{height:40px;padding:0 20px;border-radius:var(--radius-md);border:1px solid transparent;font:500 14px/1 var(--font-sans)}
.btn.p{background:var(--ink);color:var(--canvas)}
.btn.s{background:var(--surface-raised);color:var(--ink);border-color:var(--ring)}
kbd{font:500 11px/16px var(--font-sans);color:var(--muted);border:1px solid var(--hairline);border-radius:6px;padding:0 5px;background:var(--surface-raised)}
.btn.g{background:transparent;color:var(--ink)}
.help{font:400 13px/1.4 var(--font-sans);color:var(--muted);margin-top:6px}
.err{color:var(--error)}
label.l{display:block;font:500 13px/1.4 var(--font-sans);color:var(--ink);margin-bottom:6px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.qc{max-width:560px;border:1px solid var(--hairline);border-radius:var(--radius-lg);padding:28px;background:var(--surface-raised)}
.qh{display:flex;align-items:center;gap:12px;font:500 13px/1.4 var(--font-sans);color:var(--muted);margin-bottom:16px}.qh .sp{margin-left:auto}
.bd{border-radius:9999px;padding:2px 10px;background:var(--surface-card);color:var(--ink);font:500 12px/1.4 var(--font-sans)}
.fb{width:36px;height:36px;border-radius:var(--radius-full);border:1px solid var(--border-strong);background:var(--surface-raised);color:var(--ink)}
.qc fieldset{border:0;margin:0;padding:0}.qc legend{font:500 16px/1.5 var(--font-sans);color:var(--ink);margin-bottom:16px;padding:0}
.op{display:flex;align-items:center;gap:12px;min-height:48px;box-sizing:border-box;padding:10px 14px;margin-bottom:8px;border:1px solid var(--border-strong);border-radius:var(--radius-md);background:var(--surface-raised);color:var(--ink);font:400 15px/1.4 var(--font-sans)}
.op:hover{background:var(--surface-soft)}.op input{appearance:none;-webkit-appearance:none;margin:0;width:20px;height:20px;border:1.5px solid var(--border-strong);border-radius:50%;background:var(--surface-raised);flex:none}
.op.sel{background:var(--surface-cream-strong);border:2px solid var(--ink);padding:9px 13px}.op.sel input{background:var(--primary);border-color:var(--primary);box-shadow:inset 0 0 0 4px var(--surface-cream-strong)}
.op.ok{background:var(--success-soft);border-color:var(--success)}.op.no{background:var(--error-soft);border-color:var(--error)}.op .r{margin-left:auto;font-weight:600;font-size:13px}
.op.fo{outline:2px solid var(--primary);outline-offset:2px}.qf{display:flex;justify-content:space-between;margin-top:16px}.qc{border-radius:16px;padding:32px;background:var(--surface-raised)}.qc legend{font:400 24px/1.3 var(--font-serif);letter-spacing:-.3px;margin-bottom:20px}.op{border-radius:10px;border-color:var(--ring)}.op.sel{border-color:var(--ink)}.fb{border-color:var(--ring)}</style></head><body><div class="pane"><p class="tag">Light</p><article class="qc" aria-labelledby="qs"><div class="qh"><span>Question 12 of 60</span><span class="bd">Azure services</span><button class="fb sp" aria-label="Flag for review" aria-pressed="false">⚑</button></div>
<fieldset><legend id="qs">Which Azure service lets you run containers without managing servers?</legend>
<label class="op"><input type="radio" name="q"> Azure Virtual Machines</label>
<label class="op sel"><input type="radio" name="q" checked> Azure Container Instances</label>
<label class="op ok"><input type="radio" name="q" disabled> Azure Container Apps <span class="r">✓ Correct</span></label>
<label class="op no"><input type="radio" name="q" disabled> Azure Batch <span class="r">✕ Incorrect</span></label>
<label class="op fo"><input type="radio" name="q"> Azure Backup</label></fieldset>
<div class="qf"><button class="btn s">Flag for review</button><button class="btn p">Check answer</button></div></article></div><div class="pane" data-theme="dark"><p class="tag">Dark</p><article class="qc" aria-labelledby="qs"><div class="qh"><span>Question 12 of 60</span><span class="bd">Azure services</span><button class="fb sp" aria-label="Flag for review" aria-pressed="false">⚑</button></div>
<fieldset><legend id="qs">Which Azure service lets you run containers without managing servers?</legend>
<label class="op"><input type="radio" name="q"> Azure Virtual Machines</label>
<label class="op sel"><input type="radio" name="q" checked> Azure Container Instances</label>
<label class="op ok"><input type="radio" name="q" disabled> Azure Container Apps <span class="r">✓ Correct</span></label>
<label class="op no"><input type="radio" name="q" disabled> Azure Batch <span class="r">✕ Incorrect</span></label>
<label class="op fo"><input type="radio" name="q"> Azure Backup</label></fieldset>
<div class="qf"><button class="btn s">Flag for review</button><button class="btn p">Check answer</button></div></article></div></body></html>
