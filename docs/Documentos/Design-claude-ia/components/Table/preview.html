<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font:400 16px/1.55 var(--font-sans);color:var(--body)}
.pane{background:var(--canvas);color:var(--body);padding:20px 24px}
.pane+.pane{border-top:1px solid var(--hairline)}
.tag{font:500 12px/1.4 var(--font-sans);letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:12px}
*:focus-visible,.focus{outline:2px solid var(--primary);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font-family:var(--font-sans);cursor:pointer}
button:disabled{cursor:not-allowed}
.btn{height:40px;padding:0 20px;border-radius:var(--radius-md);border:1px solid transparent;font:500 14px/1 var(--font-sans)}
.btn.p{background:var(--ink);color:var(--canvas)}
.btn.s{background:var(--surface-raised);color:var(--ink);border-color:var(--ring)}
kbd{font:500 11px/16px var(--font-sans);color:var(--muted);border:1px solid var(--hairline);border-radius:6px;padding:0 5px;background:var(--surface-raised)}
.btn.g{background:transparent;color:var(--ink)}
.help{font:400 13px/1.4 var(--font-sans);color:var(--muted);margin-top:6px}
.err{color:var(--error)}
label.l{display:block;font:500 13px/1.4 var(--font-sans);color:var(--ink);margin-bottom:6px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.tw{max-width:560px;overflow-x:auto;border:1px solid var(--hairline);border-radius:var(--radius-lg)}
table{width:100%;border-collapse:collapse;font:400 14px/1.4 var(--font-sans);color:var(--ink)}
caption{text-align:left;padding:12px 16px;font:500 13px var(--font-sans);color:var(--muted)}
th{background:var(--surface-soft);text-align:left;padding:0 16px;height:40px;font:500 13px var(--font-sans);color:var(--muted);border-bottom:1px solid var(--hairline);white-space:nowrap}
th[aria-sort]{color:var(--ink)}td{height:48px;padding:0 16px;border-bottom:1px solid var(--hairline-soft)}tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums}tbody tr:hover{background:var(--surface-soft)}tr.sel{background:var(--surface-card)}
.bd{display:inline-block;border-radius:9999px;padding:2px 10px;font:500 12px/1.4 var(--font-sans);background:var(--surface-card);color:var(--ink)}.bd.ok{background:var(--success-soft)}.bd.no{background:var(--error-soft)}.tw{border-radius:12px;background:var(--surface-raised)}th{background:var(--surface-card);color:var(--ink);font:600 14px var(--font-sans)}
td:first-child{font-weight:600}caption{color:var(--muted);font:400 14px var(--font-sans);caption-side:bottom;padding:8px 4px}</style></head><body><div class="pane"><p class="tag">Light</p><div class="tw"><table><caption>Recent mock exams</caption><thead><tr><th scope="col">Exam</th><th scope="col" aria-sort="descending">Date ↓</th><th scope="col" class="num">Score</th><th scope="col">Result</th></tr></thead><tbody><tr class="sel"><td>AZ-900 Mock 4</td><td>Nov 18</td><td class="num">812</td><td><span class="bd ok">Passed</span></td></tr><tr><td>AZ-900 Mock 3</td><td>Nov 12</td><td class="num">690</td><td><span class="bd ok">Passed</span></td></tr><tr><td>SC-900 Mock 1</td><td>Nov 03</td><td class="num">588</td><td><span class="bd no">Not passed</span></td></tr></tbody></table></div></div><div class="pane" data-theme="dark"><p class="tag">Dark</p><div class="tw"><table><caption>Recent mock exams</caption><thead><tr><th scope="col">Exam</th><th scope="col" aria-sort="descending">Date ↓</th><th scope="col" class="num">Score</th><th scope="col">Result</th></tr></thead><tbody><tr class="sel"><td>AZ-900 Mock 4</td><td>Nov 18</td><td class="num">812</td><td><span class="bd ok">Passed</span></td></tr><tr><td>AZ-900 Mock 3</td><td>Nov 12</td><td class="num">690</td><td><span class="bd ok">Passed</span></td></tr><tr><td>SC-900 Mock 1</td><td>Nov 03</td><td class="num">588</td><td><span class="bd no">Not passed</span></td></tr></tbody></table></div></div></body></html>
