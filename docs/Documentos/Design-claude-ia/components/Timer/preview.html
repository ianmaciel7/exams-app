<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font:400 16px/1.55 var(--font-sans);color:var(--body)}
.pane{background:var(--canvas);color:var(--body);padding:20px 24px}
.pane+.pane{border-top:1px solid var(--hairline)}
.tag{font:500 12px/1.4 var(--font-sans);letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:12px}
*:focus-visible,.focus{outline:2px solid var(--primary);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font-family:var(--font-sans);cursor:pointer}
button:disabled{cursor:not-allowed}
.btn{height:40px;padding:0 20px;border-radius:var(--radius-md);border:1px solid transparent;font:500 14px/1 var(--font-sans)}
.btn.p{background:var(--ink);color:var(--canvas)}
.btn.s{background:var(--surface-raised);color:var(--ink);border-color:var(--ring)}
kbd{font:500 11px/16px var(--font-sans);color:var(--muted);border:1px solid var(--hairline);border-radius:6px;padding:0 5px;background:var(--surface-raised)}
.btn.g{background:transparent;color:var(--ink)}
.help{font:400 13px/1.4 var(--font-sans);color:var(--muted);margin-top:6px}
.err{color:var(--error)}
label.l{display:block;font:500 13px/1.4 var(--font-sans);color:var(--ink);margin-bottom:6px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.tm{display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border-radius:9999px;border:1px solid var(--hairline);background:var(--surface-card);color:var(--ink);font:500 14px/1.4 var(--font-sans);margin:0 12px 12px 0}
.tm .v{font:500 20px/1.2 var(--font-mono);font-variant-numeric:tabular-nums}.tm .m{font-size:12px;font-weight:600}.tm.w{background:var(--warning-soft);border-color:var(--warning)}.tm.c{background:var(--error-soft);border-color:var(--error)}.tm.p{color:var(--muted)}.tm{background:var(--surface-raised)}.tm.w{background:var(--warning-soft)}.tm.c{background:var(--error-soft)}</style></head><body><div class="pane"><p class="tag">Light</p><div><div class="tm" role="timer" aria-live="off"><span aria-hidden="true">◷</span><span>Time left</span><span class="v">42:18</span></div><div class="tm w" role="timer" aria-live="off"><span aria-hidden="true">◷</span><span class="v">09:41</span><span class="m">10 min left</span></div><div class="tm c" role="timer" aria-live="off"><span aria-hidden="true">◷</span><span class="v">00:48</span><span class="m">Under 1 min</span></div><div class="tm p" role="timer" aria-live="off"><span aria-hidden="true">❚❚</span><span class="v">42:18</span><span class="m">Paused</span></div></div></div><div class="pane" data-theme="dark"><p class="tag">Dark</p><div><div class="tm" role="timer" aria-live="off"><span aria-hidden="true">◷</span><span>Time left</span><span class="v">42:18</span></div><div class="tm w" role="timer" aria-live="off"><span aria-hidden="true">◷</span><span class="v">09:41</span><span class="m">10 min left</span></div><div class="tm c" role="timer" aria-live="off"><span aria-hidden="true">◷</span><span class="v">00:48</span><span class="m">Under 1 min</span></div><div class="tm p" role="timer" aria-live="off"><span aria-hidden="true">❚❚</span><span class="v">42:18</span><span class="m">Paused</span></div></div></div></body></html>
