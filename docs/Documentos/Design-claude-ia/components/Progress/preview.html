<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font:400 16px/1.55 var(--font-sans);color:var(--body)}
.pane{background:var(--canvas);color:var(--body);padding:20px 24px}
.pane+.pane{border-top:1px solid var(--hairline)}
.tag{font:500 12px/1.4 var(--font-sans);letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:12px}
*:focus-visible,.focus{outline:2px solid var(--primary);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font-family:var(--font-sans);cursor:pointer}
button:disabled{cursor:not-allowed}
.btn{height:40px;padding:0 20px;border-radius:var(--radius-md);border:1px solid transparent;font:500 14px/1 var(--font-sans)}
.btn.p{background:var(--ink);color:var(--canvas)}
.btn.s{background:var(--surface-raised);color:var(--ink);border-color:var(--ring)}
kbd{font:500 11px/16px var(--font-sans);color:var(--muted);border:1px solid var(--hairline);border-radius:6px;padding:0 5px;background:var(--surface-raised)}
.btn.g{background:transparent;color:var(--ink)}
.help{font:400 13px/1.4 var(--font-sans);color:var(--muted);margin-top:6px}
.err{color:var(--error)}
label.l{display:block;font:500 13px/1.4 var(--font-sans);color:var(--ink);margin-bottom:6px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.pr{max-width:360px;margin-bottom:16px}.pr .h{display:flex;justify-content:space-between;font:500 13px/1.4 var(--font-sans);color:var(--ink);margin-bottom:6px}
.trk{height:8px;border-radius:9999px;background:var(--surface-card);border:1px solid var(--border-strong);overflow:hidden;box-sizing:content-box}
.fl{height:100%;background:var(--primary);border-radius:9999px}.fl.ok{background:var(--accent-teal)}
.fl.ind{width:35%;animation:sl 1.4s ease-in-out infinite}@keyframes sl{0%{margin-left:-35%}100%{margin-left:100%}}
.seg{display:flex;gap:3px}.seg i{flex:1;height:8px;border-radius:2px;background:var(--surface-cream-strong);border:1px solid var(--border-strong);box-sizing:border-box}.seg i.on{background:var(--primary);border-color:var(--primary)}.trk{background:var(--surface-card);border-color:var(--ring)}</style></head><body><div class="pane"><p class="tag">Light</p><div class="pr"><div class="h"><span id="p1">Mock exam</span><span>34 of 60</span></div><div class="trk" role="progressbar" aria-labelledby="p1" aria-valuenow="34" aria-valuemin="0" aria-valuemax="60"><div class="fl" style="width:57%"></div></div></div>
<div class="pr"><div class="h"><span id="p2">Daily goal</span><span>20 of 20 ✓</span></div><div class="trk" role="progressbar" aria-labelledby="p2" aria-valuenow="20" aria-valuemin="0" aria-valuemax="20"><div class="fl ok" style="width:100%"></div></div></div>
<div class="pr"><div class="h"><span id="p3">Loading questions…</span></div><div class="trk" role="progressbar" aria-labelledby="p3"><div class="fl ind"></div></div></div>
<div class="pr"><div class="seg" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i></div><div class="help">Segmented: question 4 of 8</div></div></div><div class="pane" data-theme="dark"><p class="tag">Dark</p><div class="pr"><div class="h"><span id="p1">Mock exam</span><span>34 of 60</span></div><div class="trk" role="progressbar" aria-labelledby="p1" aria-valuenow="34" aria-valuemin="0" aria-valuemax="60"><div class="fl" style="width:57%"></div></div></div>
<div class="pr"><div class="h"><span id="p2">Daily goal</span><span>20 of 20 ✓</span></div><div class="trk" role="progressbar" aria-labelledby="p2" aria-valuenow="20" aria-valuemin="0" aria-valuemax="20"><div class="fl ok" style="width:100%"></div></div></div>
<div class="pr"><div class="h"><span id="p3">Loading questions…</span></div><div class="trk" role="progressbar" aria-labelledby="p3"><div class="fl ind"></div></div></div>
<div class="pr"><div class="seg" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i></div><div class="help">Segmented: question 4 of 8</div></div></div></body></html>
