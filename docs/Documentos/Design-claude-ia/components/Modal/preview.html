<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font:400 16px/1.55 var(--font-sans);color:var(--body)}
.pane{background:var(--canvas);color:var(--body);padding:20px 24px}
.pane+.pane{border-top:1px solid var(--hairline)}
.tag{font:500 12px/1.4 var(--font-sans);letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:12px}
*:focus-visible,.focus{outline:2px solid var(--primary);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font-family:var(--font-sans);cursor:pointer}
button:disabled{cursor:not-allowed}
.btn{height:40px;padding:0 20px;border-radius:var(--radius-md);border:1px solid transparent;font:500 14px/1 var(--font-sans)}
.btn.p{background:var(--ink);color:var(--canvas)}
.btn.s{background:var(--surface-raised);color:var(--ink);border-color:var(--ring)}
kbd{font:500 11px/16px var(--font-sans);color:var(--muted);border:1px solid var(--hairline);border-radius:6px;padding:0 5px;background:var(--surface-raised)}
.btn.g{background:transparent;color:var(--ink)}
.help{font:400 13px/1.4 var(--font-sans);color:var(--muted);margin-top:6px}
.err{color:var(--error)}
label.l{display:block;font:500 13px/1.4 var(--font-sans);color:var(--ink);margin-bottom:6px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.ov{background:var(--overlay);padding:28px 24px;border-radius:var(--radius-lg)}
.md{position:relative;max-width:440px;margin:0 auto;background:var(--surface-raised);border:1px solid var(--hairline);border-radius:var(--radius-lg);padding:32px;box-shadow:var(--shadow-popover)}
.md h2{font:400 28px/1.2 var(--font-serif);letter-spacing:-.3px;color:var(--ink);margin:0 0 8px}.md p{margin:0 0 24px;font-size:14px}
.md .x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:var(--radius-full);border:0;background:transparent;color:var(--ink);font-size:20px}
.md .act{display:flex;justify-content:flex-end;gap:12px}.md{border-radius:16px;padding:32px}.md h2{font-size:32px}</style></head><body><div class="pane"><p class="tag">Light</p><div class="ov"><div class="md" role="alertdialog" aria-modal="true" aria-labelledby="mt" aria-describedby="mp"><button class="x" aria-label="Close">×</button><h2 id="mt">Finish exam?</h2><p id="mp">You have 12 unanswered questions and 8 minutes left. Unanswered questions count as incorrect.</p><div class="act"><button class="btn s">Keep going</button><button class="btn p">Finish exam</button></div></div></div></div><div class="pane" data-theme="dark"><p class="tag">Dark</p><div class="ov"><div class="md" role="alertdialog" aria-modal="true" aria-labelledby="mt" aria-describedby="mp"><button class="x" aria-label="Close">×</button><h2 id="mt">Finish exam?</h2><p id="mp">You have 12 unanswered questions and 8 minutes left. Unanswered questions count as incorrect.</p><div class="act"><button class="btn s">Keep going</button><button class="btn p">Finish exam</button></div></div></div></div></body></html>
