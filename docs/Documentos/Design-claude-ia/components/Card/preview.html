<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;padding:24px;background:var(--canvas);font:400 16px/1.55 var(--font-sans);color:var(--body)}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.c{border-radius:var(--radius-lg);padding:32px}.f{background:var(--surface-card);color:var(--ink)}.h{background:var(--canvas);border:1px solid var(--hairline);color:var(--ink)}.d{background:var(--surface-dark);color:var(--on-dark)}h3{font:500 18px/1.4 var(--font-sans);margin:0 0 8px}p{margin:0;font-size:14px}.d p{color:var(--on-dark-soft)}</style></head><body><div class="g"><div class="c f"><h3>Feature card</h3><p>Cream fill, no shadow, 12px radius.</p></div><div class="c h"><h3>Hairline card</h3><p>Canvas with a 1px hairline border.</p></div><div class="c d"><h3>Dark card</h3><p>Warm near-black showcase surface.</p></div></div></body></html>
