<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font:400 16px/1.55 var(--font-sans);color:var(--body)}
.pane{background:var(--canvas);color:var(--body);padding:20px 24px}
.pane+.pane{border-top:1px solid var(--hairline)}
.tag{font:500 12px/1.4 var(--font-sans);letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:12px}
*:focus-visible,.focus{outline:2px solid var(--primary);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font-family:var(--font-sans);cursor:pointer}
button:disabled{cursor:not-allowed}
.btn{height:40px;padding:0 20px;border-radius:var(--radius-md);border:1px solid transparent;font:500 14px/1 var(--font-sans)}
.btn.p{background:var(--ink);color:var(--canvas)}
.btn.s{background:var(--surface-raised);color:var(--ink);border-color:var(--ring)}
kbd{font:500 11px/16px var(--font-sans);color:var(--muted);border:1px solid var(--hairline);border-radius:6px;padding:0 5px;background:var(--surface-raised)}
.btn.g{background:transparent;color:var(--ink)}
.help{font:400 13px/1.4 var(--font-sans);color:var(--muted);margin-top:6px}
.err{color:var(--error)}
label.l{display:block;font:500 13px/1.4 var(--font-sans);color:var(--ink);margin-bottom:6px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sel{display:flex;justify-content:space-between;align-items:center;width:240px;height:40px;box-sizing:border-box;padding:0 14px;border:1px solid var(--border-strong);border-radius:var(--radius-md);background:var(--surface-raised);color:var(--ink);font:400 16px var(--font-sans)}
.sel.h{background:var(--surface-soft)}.sel.f{border-color:var(--primary);box-shadow:var(--shadow-focus)}
.sel.d{background:var(--primary-disabled);color:var(--muted);border-color:var(--hairline);cursor:not-allowed}
.sel.e{border-color:var(--error)}
.list{width:240px;margin:6px 0 0;padding:4px;list-style:none;background:var(--surface-raised);border:1px solid var(--hairline);border-radius:var(--radius-md);box-shadow:var(--shadow-popover);font:400 14px/1.4 var(--font-sans);color:var(--ink)}
.list li{display:flex;justify-content:space-between;padding:8px 10px;border-radius:var(--radius-sm)}
.list li.hl{background:var(--surface-card)}.list{border-radius:12px;padding:6px}.list li{border-radius:8px}</style></head><body><div class="pane"><p class="tag">Light</p><div class="row"><div><label class="l">Exam</label><button class="sel" aria-haspopup="listbox" aria-expanded="false"><span>AZ-900</span><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg></button></div>
<div><label class="l">Hover</label><button class="sel h">SC-900<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg></button></div>
<div><label class="l">Focus</label><button class="sel f">AZ-104<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg></button></div></div>
<div class="row" style="margin-top:12px"><div><label class="l">Disabled</label><button class="sel d" disabled>No exams yet<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg></button></div>
<div><label class="l">Error</label><button class="sel e" aria-invalid="true">Select an exam</button><div class="help err">Choose an exam to continue.</div></div>
<div><ul class="list" role="listbox" aria-label="Exam"><li role="option" aria-selected="true">AZ-900 <span>✓</span></li><li role="option" class="hl">SC-900</li><li role="option">AZ-104</li></ul></div></div></div><div class="pane" data-theme="dark"><p class="tag">Dark</p><div class="row"><div><label class="l">Exam</label><button class="sel" aria-haspopup="listbox" aria-expanded="false"><span>AZ-900</span><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg></button></div>
<div><label class="l">Hover</label><button class="sel h">SC-900<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg></button></div>
<div><label class="l">Focus</label><button class="sel f">AZ-104<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg></button></div></div>
<div class="row" style="margin-top:12px"><div><label class="l">Disabled</label><button class="sel d" disabled>No exams yet<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg></button></div>
<div><label class="l">Error</label><button class="sel e" aria-invalid="true">Select an exam</button><div class="help err">Choose an exam to continue.</div></div>
<div><ul class="list" role="listbox" aria-label="Exam"><li role="option" aria-selected="true">AZ-900 <span>✓</span></li><li role="option" class="hl">SC-900</li><li role="option">AZ-104</li></ul></div></div></div></body></html>
