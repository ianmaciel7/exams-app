<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font:400 16px/1.55 var(--font-sans);color:var(--body)}
.pane{background:var(--canvas);color:var(--body);padding:20px 24px}
.pane+.pane{border-top:1px solid var(--hairline)}
.tag{font:500 12px/1.4 var(--font-sans);letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:12px}
*:focus-visible,.focus{outline:2px solid var(--primary);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font-family:var(--font-sans);cursor:pointer}
button:disabled{cursor:not-allowed}
.btn{height:40px;padding:0 20px;border-radius:var(--radius-md);border:1px solid transparent;font:500 14px/1 var(--font-sans)}
.btn.p{background:var(--ink);color:var(--canvas)}
.btn.s{background:var(--surface-raised);color:var(--ink);border-color:var(--ring)}
kbd{font:500 11px/16px var(--font-sans);color:var(--muted);border:1px solid var(--hairline);border-radius:6px;padding:0 5px;background:var(--surface-raised)}
.btn.g{background:transparent;color:var(--ink)}
.help{font:400 13px/1.4 var(--font-sans);color:var(--muted);margin-top:6px}
.err{color:var(--error)}
label.l{display:block;font:500 13px/1.4 var(--font-sans);color:var(--ink);margin-bottom:6px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.ov{background:var(--overlay);padding:24px;border-radius:var(--radius-lg)}
.cp{width:100%;max-width:520px;margin:0 auto;background:var(--surface-raised);border:1px solid var(--hairline);border-radius:var(--radius-lg);box-shadow:var(--shadow-popover);overflow:hidden;font:400 14px/1.4 var(--font-sans);color:var(--ink)}
.cp input{width:100%;box-sizing:border-box;height:48px;padding:0 16px;border:0;border-bottom:1px solid var(--hairline);background:transparent;color:var(--ink);font:400 16px var(--font-sans);outline:none}
.cp .g{font:500 12px/1.4 var(--font-sans);letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);padding:12px 16px 4px}
.cp ul{list-style:none;margin:0;padding:0 8px 8px}.cp li{display:flex;justify-content:space-between;height:36px;align-items:center;padding:0 8px;border-radius:var(--radius-sm)}
.cp li.hl{background:var(--surface-card)}.cp kbd{font:400 12px var(--font-mono);color:var(--muted)}.cp{border-radius:16px}.cp input{height:52px}.cp li{border-radius:8px}.cp kbd{font:500 11px/16px var(--font-sans)}</style></head><body><div class="pane"><p class="tag">Light</p><div class="ov"><div class="cp" role="dialog" aria-label="Command palette"><input role="combobox" aria-expanded="true" aria-controls="lb" aria-activedescendant="o1" placeholder="Search exams, notes, actions…" value="az"><div class="g">Exams</div><ul id="lb" role="listbox"><li id="o1" role="option" aria-selected="true" class="hl"><span><b>AZ</b>-900 Azure Fundamentals</span><kbd>↵</kbd></li><li role="option"><span><b>AZ</b>-104 Administrator</span></li></ul><div class="g">Actions</div><ul role="listbox"><li role="option"><span>Start a mock <b>az</b>ure exam</span><kbd>Ctrl M</kbd></li></ul></div></div></div><div class="pane" data-theme="dark"><p class="tag">Dark</p><div class="ov"><div class="cp" role="dialog" aria-label="Command palette"><input role="combobox" aria-expanded="true" aria-controls="lb" aria-activedescendant="o1" placeholder="Search exams, notes, actions…" value="az"><div class="g">Exams</div><ul id="lb" role="listbox"><li id="o1" role="option" aria-selected="true" class="hl"><span><b>AZ</b>-900 Azure Fundamentals</span><kbd>↵</kbd></li><li role="option"><span><b>AZ</b>-104 Administrator</span></li></ul><div class="g">Actions</div><ul role="listbox"><li role="option"><span>Start a mock <b>az</b>ure exam</span><kbd>Ctrl M</kbd></li></ul></div></div></div></body></html>
