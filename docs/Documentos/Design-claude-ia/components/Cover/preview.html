<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:var(--canvas)}
.s{position:relative;width:960px;height:288px}
.pri{fill:var(--primary)}.drk{fill:var(--surface-dark)}.crm{fill:var(--surface-cream-strong)}.amb{fill:var(--accent-amber)}.tl{fill:var(--accent-teal)}
.blk{rx:12px}.rule{stroke:var(--hairline);stroke-width:1}
.t{position:absolute;left:32px;top:134px;width:896px}
h1{margin:0;font:400 64px/.95 var(--font-serif);letter-spacing:-1.5px;color:var(--ink)}
p{margin:12px 0 0;font:400 14px/1.4 var(--font-sans);color:var(--muted)}
</style></head><body><div class="s">
<svg width="960" height="112" viewBox="0 0 960 112">
<!-- blocks: primary 352, surface-dark 232, surface-cream-strong 152, accent-amber 112, accent-teal 72 wide x 112 high, gaps space-xs (8).
arrangement: one flush strip of unequal bands bleeding off the top, left and right edges.
pattern: editorial serif system, borders not shadows -> three hairline rules at a 28px baseline pitch crossing the blocks.
steps and radii: space-xs gaps, radius-lg corners, hairline stroke. -->
<rect class="pri blk" x="0" y="-12" width="352" height="124"/><rect class="drk blk" x="360" y="-12" width="232" height="124"/><rect class="crm blk" x="600" y="-12" width="152" height="124"/><rect class="amb blk" x="760" y="-12" width="112" height="124"/><rect class="tl blk" x="880" y="-12" width="80" height="124"/>
<line class="rule" x1="0" x2="960" y1="28" y2="28"/><line class="rule" x1="0" x2="960" y1="56" y2="56"/><line class="rule" x1="0" x2="960" y1="84" y2="84"/>
</svg>
<div class="t"><h1>Exams App Design System</h1><p>Warm cream, one coral accent, serif headlines.</p></div>
</div></body></html>
