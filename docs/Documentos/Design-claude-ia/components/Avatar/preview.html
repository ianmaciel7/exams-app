<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font:400 16px/1.55 var(--font-sans);color:var(--body)}
.pane{background:var(--canvas);color:var(--body);padding:20px 24px}
.pane+.pane{border-top:1px solid var(--hairline)}
.tag{font:500 12px/1.4 var(--font-sans);letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:12px}
*:focus-visible,.focus{outline:2px solid var(--primary);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font-family:var(--font-sans);cursor:pointer}
button:disabled{cursor:not-allowed}
.btn{height:40px;padding:0 20px;border-radius:var(--radius-md);border:1px solid transparent;font:500 14px/1 var(--font-sans)}
.btn.p{background:var(--ink);color:var(--canvas)}
.btn.s{background:var(--surface-raised);color:var(--ink);border-color:var(--ring)}
kbd{font:500 11px/16px var(--font-sans);color:var(--muted);border:1px solid var(--hairline);border-radius:6px;padding:0 5px;background:var(--surface-raised)}
.btn.g{background:transparent;color:var(--ink)}
.help{font:400 13px/1.4 var(--font-sans);color:var(--muted);margin-top:6px}
.err{color:var(--error)}
label.l{display:block;font:500 13px/1.4 var(--font-sans);color:var(--ink);margin-bottom:6px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-full);background:var(--surface-cream-strong);color:var(--ink);font:500 14px var(--font-sans);position:relative;flex:none;border:0}
.av.s24{width:24px;height:24px;font-size:11px}.av.s32{width:32px;height:32px;font-size:13px}.av.s40{width:40px;height:40px}
.st{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:var(--accent-teal);border:2px solid var(--canvas)}
.grp{display:flex}.grp .av{box-shadow:0 0 0 2px var(--canvas)}.grp .av+.av{margin-left:-8px}.av{background:var(--surface-card)}</style></head><body><div class="pane"><p class="tag">Light</p><div class="row" style="align-items:center;gap:24px"><span class="av s24" role="img" aria-label="Ana Lima">AL</span><span class="av s32" role="img" aria-label="Bruno Costa">BC</span><span class="av s40" role="img" aria-label="Carla Dias, online">CD<span class="st"></span><span class="sr">Online</span></span><button class="av s40 focus" aria-label="Account menu">IM</button><div class="grp" role="group" aria-label="Study group"><span class="av s32" role="img" aria-label="Ana Lima">AL</span><span class="av s32" role="img" aria-label="Bruno Costa">BC</span><span class="av s32" role="img" aria-label="Carla Dias">CD</span><span class="av s32" aria-label="3 more">+3</span></div></div></div><div class="pane" data-theme="dark"><p class="tag">Dark</p><div class="row" style="align-items:center;gap:24px"><span class="av s24" role="img" aria-label="Ana Lima">AL</span><span class="av s32" role="img" aria-label="Bruno Costa">BC</span><span class="av s40" role="img" aria-label="Carla Dias, online">CD<span class="st"></span><span class="sr">Online</span></span><button class="av s40 focus" aria-label="Account menu">IM</button><div class="grp" role="group" aria-label="Study group"><span class="av s32" role="img" aria-label="Ana Lima">AL</span><span class="av s32" role="img" aria-label="Bruno Costa">BC</span><span class="av s32" role="img" aria-label="Carla Dias">CD</span><span class="av s32" aria-label="3 more">+3</span></div></div></div></body></html>
