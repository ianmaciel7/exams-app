<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font:400 16px/1.55 var(--font-sans);color:var(--body)}
.pane{background:var(--canvas);color:var(--body);padding:20px 24px}
.pane+.pane{border-top:1px solid var(--hairline)}
.tag{font:500 12px/1.4 var(--font-sans);letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:12px}
*:focus-visible,.focus{outline:2px solid var(--primary);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font-family:var(--font-sans);cursor:pointer}
button:disabled{cursor:not-allowed}
.btn{height:40px;padding:0 20px;border-radius:var(--radius-md);border:1px solid transparent;font:500 14px/1 var(--font-sans)}
.btn.p{background:var(--ink);color:var(--canvas)}
.btn.s{background:var(--surface-raised);color:var(--ink);border-color:var(--ring)}
kbd{font:500 11px/16px var(--font-sans);color:var(--muted);border:1px solid var(--hairline);border-radius:6px;padding:0 5px;background:var(--surface-raised)}
.btn.g{background:transparent;color:var(--ink)}
.help{font:400 13px/1.4 var(--font-sans);color:var(--muted);margin-top:6px}
.err{color:var(--error)}
label.l{display:block;font:500 13px/1.4 var(--font-sans);color:var(--ink);margin-bottom:6px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.ta{display:block;width:300px;min-height:96px;box-sizing:border-box;padding:10px 14px;border:1px solid var(--border-strong);border-radius:var(--radius-md);background:var(--surface-raised);color:var(--ink);font:400 16px/1.55 var(--font-sans);resize:vertical}
.ta.h{background:var(--surface-soft)}.ta.f{border-color:var(--primary);box-shadow:var(--shadow-focus);outline:none}
.ta.e{border-color:var(--error)}.ta:disabled{background:var(--primary-disabled);color:var(--muted);border-color:var(--hairline);cursor:not-allowed}
.ta.ro{border-color:transparent;background:var(--surface-card)}.cnt{display:flex;justify-content:space-between}</style></head><body><div class="pane"><p class="tag">Light</p><div class="row"><div><label class="l" for="t1">Note</label><textarea id="t1" class="ta f" aria-describedby="h1">Remember: Azure regions pair for disaster recovery.</textarea><div class="help cnt" id="h1"><span>Markdown supported</span><span>52 / 500</span></div></div>
<div><label class="l" for="t2">Explanation</label><textarea id="t2" class="ta e" aria-invalid="true" aria-describedby="h2"></textarea><div class="help err" id="h2">Write at least 20 characters.</div></div>
<div><label class="l" for="t3">Disabled</label><textarea id="t3" class="ta" disabled>Locked during the exam.</textarea></div>
<div><label class="l" for="t4">Hover</label><textarea id="t4" class="ta h"></textarea></div></div></div><div class="pane" data-theme="dark"><p class="tag">Dark</p><div class="row"><div><label class="l" for="t1">Note</label><textarea id="t1" class="ta f" aria-describedby="h1">Remember: Azure regions pair for disaster recovery.</textarea><div class="help cnt" id="h1"><span>Markdown supported</span><span>52 / 500</span></div></div>
<div><label class="l" for="t2">Explanation</label><textarea id="t2" class="ta e" aria-invalid="true" aria-describedby="h2"></textarea><div class="help err" id="h2">Write at least 20 characters.</div></div>
<div><label class="l" for="t3">Disabled</label><textarea id="t3" class="ta" disabled>Locked during the exam.</textarea></div>
<div><label class="l" for="t4">Hover</label><textarea id="t4" class="ta h"></textarea></div></div></div></body></html>
