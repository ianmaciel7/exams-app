<!doctype html>
<html lang="pt-BR" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exam App · Boards</title>
<style>
:root{color-scheme:dark;--bg:#141517;--panel:#1c1e21;--fg:#f1f2f4;--muted:#a7a9b0;--border:#34363d;--active:#343842}
:root[data-theme=light]{color-scheme:light;--bg:#f7f7f8;--panel:#fff;--fg:#22242a;--muted:#626570;--border:#dddfe4;--active:#e8ebf3}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--fg)}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--border)}header strong{font-size:18px}a{color:inherit}button,select{background:var(--panel);color:var(--fg);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font:inherit;cursor:pointer}button[aria-current=true]{background:var(--active);font-weight:600}button:focus-visible,a:focus-visible{outline:2px solid #729aff;outline-offset:3px}.muted{color:var(--muted);font-size:13px}.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100dvh - 72px)}nav{padding:18px 12px;border-right:1px solid var(--border)}nav button{display:block;text-align:left;width:100%;margin:4px 0;border-color:transparent}main{min-width:0;padding:18px}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar h1{font-size:20px;margin:0 auto 0 0}.viewer{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:auto;max-height:76dvh;min-height:200px}.viewer img{display:block;width:100%;height:auto;max-width:none}.viewer:fullscreen{max-height:none;width:100%;height:100%;border-radius:0}.viewer:fullscreen img{min-width:100%}.grow{flex:1}#status{margin:12px 0}.mobile{display:none}@media(max-width:720px){.shell{display:block}nav{display:none}.mobile{display:block;width:100%;margin:8px 0}main{padding:12px}header{padding:12px}.viewer{max-height:70dvh}.toolbar h1{width:100%}}
</style></head><body><header><strong>Exam App</strong><span class="muted">Boards · dev</span><div class="grow"></div><a id="commit" class="muted" href="https://github.com/ianmaciel7/exams-app/tree/dev">GitHub</a><button id="theme" type="button">Tema claro</button></header>
<div class="shell"><nav id="nav" aria-label="Boards"></nav><main><select id="mobile" class="mobile" aria-label="Selecionar board"></select><div class="toolbar"><h1 id="title">Boards</h1><button id="minus" aria-label="Reduzir zoom">−</button><button id="fit">Ajustar</button><button id="plus" aria-label="Aumentar zoom">+</button><button id="full">Tela cheia</button><a id="original" target="_blank" rel="noopener">PNG original</a><a id="source" target="_blank" rel="noopener">Arquivos</a></div><select id="state" aria-label="Board state" hidden style="margin-bottom:10px;max-width:100%"></select><div id="viewer" class="viewer"><img id="image" alt=""></div><p id="status" class="muted" role="status">Carregando…</p><p class="muted">Capturas do Open Artifact · visualização somente leitura. <a href="https://github.com/ianmaciel7/exams-app/tree/archive/v0.1.0-before-reset-20261126">Histórico anterior ao reset</a></p></main></div>
<script>
let data,selected,theme='dark',zoom=1,state='';
const $=id=>document.getElementById(id);
function setZoom(n){zoom=Math.max(1,Math.min(8,n));$('image').style.width=(zoom*100)+'%';$('fit').textContent=zoom===1?'Ajustar':Math.round(zoom*100)+'%';}
function show(id){const b=data.boards.find(b=>b.id===id)||data.boards[0];if(selected!==b.id)state='';selected=b.id;location.hash=b.id;const picker=$('state');picker.hidden=!b.states?.length;picker.replaceChildren(new Option('Visão geral',''));for(const s of b.states||[])picker.add(new Option(({top:'Início',end:'Paginação',selected:'Selecionada',correct:'Acerto',wrong:'Erro',loading:'Carregamento',empty:'Vazio',failure:'Falha',narrow:'Expanded narrow workspace',hover:'Sidebar hover (study)',focus:'Keyboard focus (study)',submitting:'Submission pending','submit-failure':'Submission failure','no-items':'Empty sidebar (proposal)',collapsed:'Collapsed sidebar (study)','long-content':'Long content (study)','page-middle':'Middle page','page-last':'Last page',mobile:'Phone layout (proposal)','sidebar-loading':'Sidebar loading (proposal)','sidebar-failure':'Sidebar load failure (proposal)'})[s.id]||s.id,s.id));picker.value=state;const image=b.states?.find(s=>s.id===state)?.images[theme]||b.images[theme];$('title').textContent=b.label;$('mobile').value=b.id;$('image').src=image;$('image').alt='Captura real de '+b.label;$('original').href=image;$('source').href='https://github.com/ianmaciel7/exams-app/tree/'+data.commit+'/'+b.dir;$('status').textContent=(b.elementCount===0?'Board vazio':b.elementCount+' elementos')+' · '+new Date(data.generatedAt).toLocaleString('pt-BR');document.querySelectorAll('nav button').forEach(el=>el.setAttribute('aria-current',String(el.dataset.id===b.id)));setZoom(1);$('viewer').scrollTo(0,0);}
$('theme').onclick=()=>{theme=theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;$('theme').textContent=theme==='dark'?'Tema claro':'Tema escuro';if(data)show(selected)};
$('plus').onclick=()=>setZoom(zoom*1.4);$('minus').onclick=()=>setZoom(zoom/1.4);$('fit').onclick=()=>setZoom(1);$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else if($('viewer').requestFullscreen)$('viewer').requestFullscreen().catch(()=>window.open($('original').href,'_blank'));else window.open($('original').href,'_blank')};$('mobile').onchange=e=>show(e.target.value);$('state').onchange=e=>{state=e.target.value;show(selected)};
window.addEventListener('hashchange',()=>{if(data&&location.hash.slice(1)!==selected)show(location.hash.slice(1))});
fetch('manifest.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(m=>{data=m;$('commit').textContent='dev · '+m.commit.slice(0,7);$('commit').href='https://github.com/ianmaciel7/exams-app/commit/'+m.commit;for(const b of m.boards){const btn=document.createElement('button');btn.textContent=b.label;btn.dataset.id=b.id;btn.onclick=()=>show(b.id);$('nav').append(btn);const opt=document.createElement('option');opt.value=b.id;opt.textContent=b.label;$('mobile').append(opt)}show(location.hash.slice(1))}).catch(()=>{$('status').textContent='Não foi possível carregar o manifesto.'});
</script></body></html>
