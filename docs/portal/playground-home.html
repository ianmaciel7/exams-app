<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Exam App — Artifacts</title>
  <style>
    /* Native Open Artifact v0.17.0 semantic tokens, extracted at build time. */
    /* THEME_TOKENS */
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--open-artifact-canvas); color: var(--open-artifact-fg); font: 13px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 2px solid var(--open-artifact-select); outline-offset: 3px; }
    main { width: 100%; max-width: 1040px; margin-inline: auto; padding: 24px 16px 48px; }
    .header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .identity { display: flex; align-items: center; gap: 10px; }
    .identity svg { width: 24px; height: 24px; flex: none; }
    h1 { font-size: 20px; font-weight: 600; margin: 0; line-height: 1.4; }
    .subtitle { color: var(--open-artifact-fg-muted); margin: 4px 0 0 34px; }
    .actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--open-artifact-line); border-radius: 6px; background: var(--open-artifact-surface); padding: 7px 10px; font-weight: 500; min-height: 34px; }
    .button:hover { background: var(--open-artifact-hover); border-color: var(--open-artifact-line-strong); }
    .notice { color: var(--open-artifact-fg-muted); margin: 20px 0 24px; display: flex; align-items: flex-start; gap: 7px; font-size: 12px; }
    .notice svg { flex: none; margin-top: 2px; }
    .library-toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin: 0 0 22px; }
    .current-link { display:inline-flex; align-items:center; gap:8px; font-weight:500; min-width:0; flex-wrap:wrap; }
    .current-link:hover .current-name { text-decoration:underline; text-underline-offset:3px; }
    .current-label { font-size:12px; color:var(--open-artifact-fg-muted); }
    .current-name { color:var(--open-artifact-accent); }
    .view-switch { display:flex; gap:2px; background:var(--open-artifact-surface-2); border-radius:7px; padding:3px; }
    .view-switch[hidden] { display:none; }
    .view-switch button { font:inherit; color:var(--open-artifact-fg-muted); cursor:pointer; background:transparent; border:0; border-radius:5px; min-height:32px; padding:4px 10px; display:inline-flex; align-items:center; gap:6px; }
    .view-switch button[aria-pressed="true"] { background:var(--open-artifact-surface); color:var(--open-artifact-fg); box-shadow:0 1px 3px rgb(0 0 0 / .12); }
    .view-switch button:focus-visible { outline:2px solid var(--open-artifact-select); outline-offset:2px; }
    .name-row { display:flex; align-items:baseline; gap:8px; }
    .stage-number { color:var(--open-artifact-fg-muted); font-size:12px; font-variant-numeric:tabular-nums; min-width:19px; }
    .stage-status { color:var(--open-artifact-fg-muted); font-size:12px; }
    .artifact[data-current="true"] { border-color:var(--open-artifact-accent); }
    .current-marker { color:var(--open-artifact-accent); font-size:11px; font-weight:600; }
    body[data-view="list"] .grid { grid-template-columns:1fr; gap:6px; }
    body[data-view="list"] .artifact { flex-direction:row; align-items:center; border-radius:8px; }
    body[data-view="list"] .thumbnail { width:112px; flex:0 0 112px; border-bottom:0; border-right:1px solid var(--open-artifact-line); }
    body[data-view="list"] .details { min-width:0; padding:8px 12px; gap:3px; }
    body[data-view="list"] .metadata { justify-content:flex-start; gap:8px; }
    @media(max-width:480px) { body[data-view="list"] .thumbnail { width:76px; flex-basis:76px; } .library-toolbar { align-items:flex-start; } }
    section + section { margin-top: 26px; }
    .section-heading { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
    h2 { font-size: 13px; font-weight: 600; margin: 0; }
    .count { font-size: 12px; color: var(--open-artifact-fg-muted); font-variant-numeric: tabular-nums; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 12px; }
    .artifact { display: flex; flex-direction: column; min-width: 0; overflow: hidden; background: var(--open-artifact-surface); border: 1px solid var(--open-artifact-line); border-radius: 12px; transition: border-color .15s, box-shadow .15s; }
    .artifact-source { display:flex; min-width:0; background:var(--open-artifact-surface); border:1px solid var(--open-artifact-line); border-radius:8px; }
    .artifact-source:hover .name { color:var(--open-artifact-accent); }
    .artifact:hover { border-color: var(--open-artifact-line-strong); box-shadow: 0 3px 12px rgb(0 0 0 / .08); }
    .artifact:hover .name { color: var(--open-artifact-accent); }
    .thumbnail { display: block; aspect-ratio: 16/9; overflow: hidden; background: var(--open-artifact-surface-2); border-bottom: 1px solid var(--open-artifact-line); }
    .thumbnail img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .details { display: flex; flex-direction: column; padding: 14px; gap: 7px; flex: 1; }
    .name { font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
    .metadata { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; color: var(--open-artifact-fg-muted); font-size: 12px; }
    .type { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; background: var(--open-artifact-surface-2); padding: 1px 8px; }
    .type svg { color: #d6409f; flex: none; }
    .footer { color: var(--open-artifact-fg-muted); margin-top: 24px; font-size: 12px; }
    .footer a { text-decoration: underline; text-underline-offset: 2px; }
    @media (max-width: 480px) { main { padding-top: 16px; } .subtitle { margin-left: 0; } .actions { width: 100%; } }
    @media (prefers-reduced-motion: reduce) { .artifact { transition: none; } }
  </style>
</head>
<body>
<main>
  <header class="header">
    <div>
      <div class="identity">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 9V6a3 3 0 0 0-3-3H6a3 3 0 0 0-3 3v6a3 3 0 0 0 3 3h3"/><rect x="9" y="9" width="12" height="12" rx="3"/><circle cx="15" cy="15" r="2" fill="currentColor" stroke="none"/></svg>
        <h1>Exam App artifacts</h1>
      </div>
      <p class="subtitle">Project boards and release design artifacts</p>
    </div>
    <nav class="actions" aria-label="Other views">
      <a class="button" href="https://github.com/ianmaciel7/exams-app/tree/dev">GitHub</a>
    </nav>
  </header>
  <p class="notice"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 7.5v3.25M8 5.2h.01"/></svg> Interactive previews use temporary browser memory. Changes are not saved to GitHub; no agent is connected.</p>
  <div class="library-toolbar">
    <!-- CURRENT_STAGE -->
    <div class="view-switch" role="group" aria-label="Display mode" hidden>
      <button type="button" data-view="grid" aria-pressed="true"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="2" y="2" width="4.5" height="4.5" rx="1"/><rect x="9" y="2" width="4.5" height="4.5" rx="1"/><rect x="2" y="9" width="4.5" height="4.5" rx="1"/><rect x="9" y="9" width="4.5" height="4.5" rx="1"/></svg>Grid</button>
      <button type="button" data-view="list" aria-pressed="false"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><path d="M5 4h8M5 8h8M5 12h8M2.5 4h.01M2.5 8h.01M2.5 12h.01"/></svg>List</button>
    </div>
  </div>
  <!-- BOARD_SECTIONS -->
  <footer class="footer">Open Artifact v0.17.0 · <a href="https://github.com/ianmaciel7/exams-app/commit/COMMIT_FULL">COMMIT_SHORT</a></footer>
</main>
<script>
  const viewSwitch = document.querySelector('.view-switch');
  const buttons = [...viewSwitch.querySelectorAll('button')];
  const key = 'exam-app-library-view';
  function setView(view) {
    document.body.dataset.view = view;
    for (const button of buttons) button.setAttribute('aria-pressed', String(button.dataset.view === view));
    try { localStorage.setItem(key, view); } catch {}
  }
  let initial = 'grid';
  try { if (localStorage.getItem(key) === 'list') initial = 'list'; } catch {}
  setView(initial);
  for (const button of buttons) button.addEventListener('click', () => setView(button.dataset.view));
  viewSwitch.hidden = false;
</script>
</body>
</html>
