<style>
/* ===== Exam App 0.1.1 — páginas de estudo e detalhes, 2026 ===== */
:root{--study-accent:#4a60c7;--study-tint:#eef0ff;--study-good:#147d67;--study-warn:#ae593c}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--study-accent:#a0adff;--study-tint:#252836;--study-good:#75d2b8;--study-warn:#f0aa8b}}
:root[data-theme="dark"]{--study-accent:#a0adff;--study-tint:#252836;--study-good:#75d2b8;--study-warn:#f0aa8b}
.study-side-link{font-size:13.5px}
.nav .doc.ty{height:33px;font-size:13px}.nav .doc.ty[aria-current="page"]{background:var(--active)}
.main.study-mode .bar{background:var(--bg)}
.main.study-mode .bar .title b{font-size:13px;font-weight:500}
.main.study-mode .bar .title span{display:none}
.main.study-mode .tools,.main.study-mode .readprog{display:none}
.view:has(.study-shell){background:var(--bg);padding:0 28px 58px;scrollbar-gutter:stable}
.board:has(.study-shell){max-width:1210px;margin:0 auto}
.study-shell{width:100%;padding:31px 0 56px;color:var(--text)}
.study-shell *{box-sizing:border-box}
.study-shell a,.study-shell button{transition:background-color .12s,border-color .12s,color .12s}
.study-shell .s-breadcrumb{display:flex;align-items:center;gap:9px;margin:0 0 20px;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden}
.study-shell .s-breadcrumb a:hover{color:var(--text);text-decoration:underline}
.study-shell .s-breadcrumb .s-current{color:var(--text);overflow:hidden;text-overflow:ellipsis}
.study-shell .s-head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;padding-bottom:23px;border-bottom:1px solid var(--line)}
.study-shell .s-heading{min-width:0;flex:1}
.study-shell .s-eyebrow{display:flex;align-items:center;gap:9px;font-size:11px;line-height:16px;letter-spacing:.095em;color:var(--study-accent);font-weight:700;text-transform:uppercase;margin:0 0 9px}
.study-shell h1{font-size:clamp(25px,2.2vw,34px);font-weight:650;line-height:1.18;letter-spacing:-.038em;margin:0 0 9px;color:var(--text)}

.study-shell .s-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;padding-top:24px}
.study-shell .s-button{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 13px;border:1px solid var(--line);border-radius:9px;font-size:12.5px;font-weight:600;background:var(--pop);color:var(--text);white-space:nowrap;cursor:pointer}
.study-shell .s-button:hover{border-color:var(--faint);background:var(--hover)}
.study-shell .s-button.main-cta{background:var(--study-accent);border-color:var(--study-accent);color:#10121b}
:root[data-theme="light"] .study-shell .s-button.main-cta{color:#fff}
.study-shell .s-button.main-cta:hover{filter:brightness(1.06)}
.study-shell .s-button.ghost{background:transparent}
.study-shell .s-chevron{font-size:18px;line-height:12px;color:var(--muted)}
.study-shell .s-badge{display:inline-flex;align-items:center;min-height:23px;gap:5px;padding:2px 8px;border:1px solid var(--line);border-radius:6px;color:var(--muted);font-size:11.5px;white-space:nowrap}
.study-shell .s-badge.accent{color:var(--study-accent);background:var(--study-tint);border-color:transparent}
.study-shell .s-metadata{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}
.study-shell .s-smallstats{display:flex;align-items:center;gap:0;margin-top:21px;padding:0 0 23px;border-bottom:1px solid var(--line)}
.study-shell .s-smallstat{min-width:165px;padding:0 31px;border-left:1px solid var(--line)}
.study-shell .s-smallstat:first-child{border:0;padding-left:0}
.study-shell .s-smallstat strong{font-size:21px;font-weight:640;letter-spacing:-.025em;line-height:1.1;display:block;font-variant-numeric:tabular-nums}
.study-shell .s-smallstat small{color:var(--muted);font-size:11.5px;display:block;margin:7px 0 0}
.study-shell .s-layout{display:grid;grid-template-columns:minmax(0,1.72fr) minmax(270px,.92fr);gap:34px;margin-top:26px;align-items:start}
.study-shell .s-maincol,.study-shell .s-asidecol{min-width:0}

.study-shell .s-sectionhead a,.study-shell .s-sectionhead button{font-size:12px;color:var(--muted);padding:4px 0}

.study-shell .s-ico.accent{background:var(--study-tint);color:var(--study-accent)}
.study-shell .s-subitem{margin:0;border-top:1px solid var(--line);background:color-mix(in srgb,var(--hover) 38%,transparent);display:flex;align-items:center;gap:9px;min-height:45px;padding:8px 16px 8px 59px;font-size:12.5px}

.study-shell .s-subitem a{font-weight:550}
.study-shell .s-subitem a:hover{color:var(--study-accent)}
.study-shell .s-card{padding:17px 18px;background:var(--pop);border:1px solid var(--line);border-radius:12px}
.study-shell .s-card + .s-card{margin-top:10px}
.study-shell .s-card .s-cardtitle{font-size:12px;font-weight:650;margin:0 0 12px}
.study-shell .s-muted{color:var(--muted)}
.study-shell .s-label{font-size:11.5px;color:var(--muted)}
.study-shell .s-big{font-size:26px;font-weight:650;letter-spacing:-.038em;font-variant-numeric:tabular-nums;line-height:1.2}
.study-shell .s-statgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;background:var(--pop);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.study-shell .s-stat{padding:16px 17px;border-right:1px solid var(--line)}
.study-shell .s-stat:last-child{border:0}
.study-shell .s-stat .s-big{font-size:24px}
.study-shell .s-stat .s-label{display:block;margin-bottom:8px}
.study-shell .s-stat .s-foot{display:block;color:var(--muted);font-size:11px;margin-top:7px}
.study-shell .s-progress{height:6px;border-radius:10px;background:var(--hover);overflow:hidden}
.study-shell .s-progress i{height:100%;display:block;background:var(--study-accent);border-radius:inherit;min-width:0}
.study-shell .s-progressrow{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);margin:9px 0 7px}
.study-shell .s-inlineactions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.study-shell .s-quicklist{display:grid;gap:0}
.study-shell .s-quicklist a{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);gap:8px;font-size:12.5px}
.study-shell .s-quicklist a:last-child{border:0}
.study-shell .s-quicklist a:hover{color:var(--study-accent)}
.study-shell .s-docline{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}

.study-shell .s-info-line span{color:var(--muted)}

.study-shell .s-timeline{padding-left:2px}

.study-shell select:focus-visible,.study-shell input:focus-visible{outline:2px solid var(--study-accent);outline-offset:2px}

const norm=t=>t.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const textIdx=new Map(); let indexing=null, idxDone=0, idxTotal=0;
async function buildIndex(){
  if(indexing) return indexing;
  indexing=(async()=>{
    const docs=allDocs().filter(d=>!d.del&&!isT(d.id)); idxTotal=docs.length; idxDone=0;
    for(const d of docs){
      if(textIdx.has(d.id)){ idxDone++; continue; }
      try{
        const pdf=await pdfjsLib.getDocument(d.base.data?{data:d.base.data.slice()}:'pdfs/'+d.base.f).promise;
        const pages=[];
        for(let i=1;i<=pdf.numPages;i++){ const tc=await (await pdf.getPage(i)).getTextContent(); const raw=tc.items.map(x=>x.str).join(' ').replace(/\s+/g,' '); pages.push({raw,n:norm(raw)}); }
        textIdx.set(d.id,pages); pdf.destroy();
      }catch(e){ textIdx.set(d.id,[]); }
      idxDone++; if(palOpen) renderPal();
    }
    indexing=null;
  })();
  return indexing;
}
let palOpen=false, palSel=0, palItems=[], palNewTab=false;

  { const ed=d.edicao&&edicaoById(d.edicao), cc=ed&&concursoById(ed.conc); if(ed&&cc) { const sep='<i class="bc-s" aria-hidden="true"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 1.5 7 5 3.5 8.5"/></svg></i>'; $('docMeta').innerHTML='<nav class="bc" aria-label="Localização do documento"><a href="#/concurso/'+esc(cc.id)+'">'+esc(cc.t)+'</a>'+sep+'<a href="#/edicao/'+esc(ed.id)+'">Edição '+ed.ano+'</a>'+sep+'<span class="bc-c">'+esc(d.g)+'</span></nav>'; } }
  document.title=d.t+' · Leitor';
  view.innerHTML='<div class="msg" role="status"><span class="spin" aria-hidden="true"></span> Abrindo “'+esc(d.t)+'”…</div>'; $('pg').textContent=''; $('rp').style.width='0';
  if(!hasPdf){ view.innerHTML='<div class="msg" role="alert"><b>Não foi possível carregar o leitor de PDF.</b><br>O componente de leitura não abriu, então nenhum documento pode ser exibido agora.<br><button class="cta" data-retry>Tentar de novo</button></div>'; return; }
  const my=++token;
  setTimeout(()=>{ if(my===token&&cur&&!cur.pdf&&cur.d.id===d.id){ const m=view.querySelector('.msg'); if(m) m.innerHTML='<div role="status"><span class="spin" aria-hidden="true"></span> Ainda abrindo “'+esc(d.t)+'”…<br>Está demorando mais que o normal. Documentos grandes levam mais tempo.<br><a class="cta" href="#/quadro">Cancelar e voltar ao Quadro</a></div>'; } },4000);
  if(cur&&cur.pdf){ try{cur.pdf.destroy();}catch(e){} }
  cur={d}; markCurrent();
  // A PDF is a reading task: keep its canvas clear and leave the contextual
  // workspace available from the toolbar when the user needs it.
  if(rpVisible()) openRP(false);
  paintProps(d);
  try{
    const pdf=await Promise.race([pdfjsLib.getDocument(d.data?{data:d.data.slice()}:'pdfs/'+d.f).promise,new Promise((_,rj)=>setTimeout(()=>rj(new Error('timeout')),25000))]);
    if(my!==token){ pdf.destroy(); return; }
    const vp=(await pdf.getPage(1)).getViewport({scale:1});
    cur={d,pdf,w:vp.width,h:vp.height,total:pdf.numPages,rendered:new Set()};
    store.set('pages:'+d.id,pdf.numPages); paintProps(d);
    zoom=store.get('zoom')||1;
    layout();
    const pos=(pendingPage&&pendingPage.id===d.id)?pendingPage:(!d.data&&(store.get('pos:'+d.id)||(d.start&&{page:d.start}))); pendingPage=null;
    if(pos&&pos.page>1){ const el=view.querySelector('[data-p="'+pos.page+'"]'); if(el) view.scrollTop=el.offsetTop-24; }
    onScroll();
  }catch(e){ if(my===token){
    const why=e&&e.message==='timeout'?'O arquivo demorou mais de 25 segundos para abrir.':(e&&e.name==='MissingPDFException'?'O arquivo não foi encontrado no servidor.':(navigator.onLine===false?'Você está sem conexão.':'A conexão foi interrompida ou o arquivo está inválido.'));
    view.innerHTML='<div class="msg" role="alert"><b>Não foi possível abrir “'+esc(d.t)+'”.</b><br>'+why+'<br>Seu ponto de leitura foi mantido.<br><button class="cta" data-retry>Tentar de novo</button> <a class="cta alt" href="#/quadro">Ir para o Quadro</a></div>'; token++; } }
}
function fitWidth(){ return Math.min(view.clientWidth-32,860); }
function layout(){
  if(!cur||!cur.pdf) return;
  if(io) io.disconnect(); cur.rendered.clear();
  baseW=fitWidth();
  const w=Math.round(baseW*zoom), h=Math.round(w*cur.h/cur.w);
  let s=''; for(let i=1;i<=cur.total;i++) s+='<div class="page" data-p="'+i+'" style="width:'+w+'px;height:'+h+'px"></div>';
  view.innerHTML=s; setZoomLabel();
  io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting) render(+e.target.dataset.p); }),{root:view,rootMargin:'800px 0px'});
  view.querySelectorAll('.page').forEach(p=>io.observe(p));
}
async function render(n){
  if(!cur||!cur.pdf||cur.rendered.has(n)) return;
  const c=cur; c.rendered.add(n);
  const holder=view.querySelector('[data-p="'+n+'"]'); if(!holder) return;
  const page=await c.pdf.getPage(n); if(c!==cur) return;
  const dpr=Math.min(devicePixelRatio||1,2.5), vp=page.getViewport({scale:holder.clientWidth/c.w*dpr});
  const cv=document.createElement('canvas'); cv.width=vp.width; cv.height=vp.height;
  await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
  if(c!==cur||!holder.isConnected) return;
  holder.querySelector('canvas')?.remove(); holder.prepend(cv);
  try{ holder.querySelector('.textLayer')?.remove(); const tl=document.createElement('div'); tl.className='textLayer'; holder.appendChild(tl);
    const tvp=page.getViewport({scale:holder.clientWidth/c.w}); tl.style.setProperty('--scale-factor',tvp.scale);
    await pdfjsLib.renderTextLayer({textContentSource:await page.getTextContent(),container:tl,viewport:tvp,textDivs:[]}).promise; }catch(e){}
}
let saveT;
function onScroll(){
  if(!cur||!cur.pdf) return;
  const mid=view.scrollTop+view.clientHeight/3; let p=1;
  view.querySelectorAll('.page').forEach(el=>{ if(el.offsetTop<=mid) p=+el.dataset.p; });
  $('pg').textContent=p+' / '+cur.total;
  const max=view.scrollHeight-view.clientHeight;
  $('rp').style.width=(max>0?Math.min(100,100*view.scrollTop/max):100)+'%';
  if(cur.d.data) return;
  clearTimeout(saveT);
  const id=cur.d.id, total=cur.total;
  saveT=setTimeout(()=>{ const old=store.get('pos:'+id); store.set('pos:'+id,{page:p,total}); if(!old||Math.round(100*old.page/old.total)!==Math.round(100*p/total)) paintNav(); },300);
}
view.addEventListener('scroll',onScroll,{passive:true});
function setZoom(z){
  if(!cur||!cur.pdf) return;
  const ratio=view.scrollTop/(view.scrollHeight||1);
  zoom=Math.max(.5,Math.min(3,Math.round(z*10)/10)); store.set('zoom',zoom);
  layout(); view.scrollTop=ratio*view.scrollHeight; onScroll();
}

/* ---- keyboard ---- */
document.addEventListener('keydown',e=>{
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==='b'){ e.preventDefault(); toggleSide(); return; }
  if(mod&&e.key.toLowerCase()==='k'){ e.preventDefault(); openSearch(); return; }
  if(e.key==='Escape'){ closePal(); closePops(); closeCtx(); app.classList.remove('open'); return; }
  if(e.key==='F2'&&cur&&!e.target.closest('input')){ e.preventDefault(); startRename(cur.d.id); return; }
  if(e.target.closest('input,textarea')||mod) return;
  if(e.key==='+'||e.key==='=') setZoom(zoom+.1);
  else if(e.key==='-') setZoom(zoom-.1);
  else if(e.key==='j'||e.key==='k'){
    const list=docsOf(space); const i=list.findIndex(x=>cur&&x.id===cur.d.id)+(e.key==='j'?1:-1);
    if(list[i]) location.hash=list[i].id;
  }
});

function dialog(o){
  return new Promise(res=>{
    const w=$('dlg'); const hasIn=o.input!==undefined; const opener=document.activeElement;
    const role=o.alert?'alertdialog':'dialog';
    w.innerHTML='<div class="dlg-box" role="'+role+'" aria-modal="true" aria-labelledby="dlgT"'+(o.text?' aria-describedby="dlgD"':'')+'><h2 id="dlgT">'+esc(o.title)+'</h2>'+

      '<div class="dlg-act">'+(o.noCancel?'':'<button class="btn" data-x="0">'+esc(o.cancel||'Cancelar')+'</button>')+'<button class="btn pri'+(o.danger?' danger':'')+'" data-x="1">'+esc(o.ok||'OK')+'</button></div></div>';
    w.classList.add('on');
    const inp=$('dlgIn'), okB=w.querySelector('[data-x="1"]'), errEl=$('dlgErr'), cancelB=w.querySelector('[data-x="0"]');
    const sync=()=>{ if(inp){ okB.disabled=!inp.value.trim(); if(errEl&&!errEl.hidden){ errEl.hidden=true; inp.removeAttribute('aria-invalid'); inp.removeAttribute('aria-describedby'); } } };
    const done=v=>{ w.classList.remove('on'); w.innerHTML=''; document.removeEventListener('keydown',key,true); try{ opener&&opener.isConnected&&opener.focus(); }catch(_){} res(v); };
    const submit=()=>{
      if(!inp) return done(true);
      const v=inp.value; const err=o.validate?o.validate(v.trim()):'';
      if(err){ errEl.textContent=err; errEl.hidden=false; inp.setAttribute('aria-invalid','true'); inp.setAttribute('aria-describedby','dlgErr'); inp.focus(); return; }
      done(v);
    };
    const key=e=>{
      if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); done(null); return; }
      if(e.key==='Enter'&&inp&&document.activeElement===inp){ e.preventDefault(); e.stopPropagation(); if(inp.value.trim()) submit(); return; }
      if(e.key==='Tab'){ const f=[...w.querySelectorAll('input,button:not([disabled])')]; if(!f.length) return; const i=f.indexOf(document.activeElement);
        if(e.shiftKey&&(i<=0)){ e.preventDefault(); f[f.length-1].focus(); } else if(!e.shiftKey&&(i===f.length-1||i<0)){ e.preventDefault(); f[0].focus(); } }
    };
    document.addEventListener('keydown',key,true);
    w.onclick=e=>{ if(e.target===w) return done(null); const b=e.target.closest('[data-x]'); if(!b) return; if(b.dataset.x==='1') submit(); else done(null); };
    if(inp){ inp.oninput=sync; sync(); setTimeout(()=>{ inp.focus(); inp.select(); },20); }
    else setTimeout(()=>(o.alert&&cancelB?cancelB:okB).focus(),20);
  });
}

const slug=t=>t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'x';

/* ---- Histórico de respostas, tentativas (Simulado) e Desempenho ---- */
const histAll=()=>{const v=store.get('hist');return Array.isArray(v)?v:[];};
const simsAll=()=>{const v=store.get('sims');return Array.isArray(v)?v:[];};
function histMeta(q,ok,src,at,alt,sim){ const t=at||Date.now(), qid=q.id||('q'+q.n); return {id:'r'+t.toString(36)+'-'+qid,a:alt||'',sim:sim||'',q:qid,t:t,ok:!!ok,src,m:q.materia||'',n:q.user?String(q.enunciado||'').replace(/\s+/g,' ').trim().slice(0,70):'Questão '+q.n,conc:q.conc||'',ed:q.ed||'',cg:q.cg||''}; }
function recHist(q,ok,src,at,alt){ const h=histAll(); h.push(histMeta(q,ok,src,at,alt)); store.set('hist',h); }
function recSim(s,q){
  const at=s.finished, h=histAll(), res=[];
  q.forEach(x=>{ const a=s.answers[x.n]; res.push({id:x.id||'q'+x.n,n:x.user?String(x.enunciado).replace(/\s+/g,' ').trim().slice(0,70):'Questão '+x.n,r:a?(a===x.gabarito?'ok':'err'):'-'}); if(a) h.push(histMeta(x,a===x.gabarito,'Simulado',at,a,'s'+at.toString(36))); });
  store.set('hist',h);
  const one=f=>{const v=[...new Set(q.map(f).filter(Boolean))];return v.length===1?v[0]:'';};
  const sims=simsAll(); sims.push({id:'s'+at.toString(36),at,total:q.length,answered:Object.keys(s.answers).length,correct:s.correct,score:s.score,max:s.max,secs:Math.round((at-s.started)/1000),res,conc:one(x=>x.conc),ed:one(x=>x.ed),cg:one(x=>x.cg)}); store.set('sims',sims);
}
const fmtDT=t=>{const d=new Date(t);return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});};
const fmtDur=sec=>{const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);return h?h+' h '+String(m).padStart(2,'0')+' min':m+' min';};
function perfSec(filter,title){
  const H=histAll().filter(filter||(()=>true));
  if(!H.length) return opSec(title||'Desempenho',opEmpty('Sem tentativas ainda. Resolva uma questão ou faça um simulado e o desempenho aparece aqui.'));
  const ok=H.filter(h=>h.ok).length, qs={}, ms={};
  H.forEach(h=>{ const a=qs[h.q]||(qs[h.q]={q:h.q,n:h.n,t:0,w:0}); a.t++; if(!h.ok)a.w++; if(h.m){ const b=ms[h.m]||(ms[h.m]={m:h.m,t:0,o:0}); b.t++; if(h.ok)b.o++; } });
  const miss=Object.values(qs).filter(x=>x.w>0).sort((a,b)=>b.w-a.w||b.t-a.t).slice(0,5);
  const weak=Object.values(ms).sort((a,b)=>a.o/a.t-b.o/b.t||b.t-a.t).slice(0,4);
  const simsN=new Set(H.filter(h=>h.src==='Simulado').map(h=>h.t)).size;
  const stats='<p class="op-stats"><span><b>'+H.length+'</b> '+(H.length===1?'tentativa':'tentativas')+'</span><span><b>'+pctOf(ok,H.length)+'%</b> de acerto</span><span><b>'+(H.length-ok)+'</b> '+(H.length-ok===1?'erro':'erros')+'</span>'+(simsN?'<span><b>'+simsN+'</b> '+(simsN===1?'simulado':'simulados')+'</span>':'')+'</p>';
  const mrows=miss.length?'<h3 class="perf-h">Mais erradas</h3><div class="op-list">'+miss.map(x=>'<a class="op-row" href="#/questao/'+x.q+'"><span class="op-rt"><b>'+esc(x.n)+'</b></span><span class="op-tail">errou '+x.w+' de '+x.t+'</span><span class="op-go" aria-hidden="true">›</span></a>').join('')+'</div>':'';
  const wrows=weak.length?'<h3 class="perf-h">Disciplinas mais fracas</h3><div class="op-list">'+weak.map(x=>{const e=findEnt('disciplina',x.m);return '<a class="op-row" href="'+(e?'#/disciplina/'+e.id:'#/tipo/disciplina')+'"><span class="op-rt"><b>'+esc(x.m)+'</b></span><span class="op-tail">'+pctOf(x.o,x.t)+'% · '+x.t+' tent.</span><span class="op-go" aria-hidden="true">›</span></a>';}).join('')+'</div>':'';

function finishExam(){
 let s=getExam();if(!s||s.finished)return;
 const q=examQs(s),max=q.reduce((t,x)=>t+wOf(x),0);let correct=0,score=0;let byMatter={};
 for(const x of q){if(!byMatter[x.materia])byMatter[x.materia]={count:0,correct:0};byMatter[x.materia].count++;if(s.answers[x.n]===x.gabarito){correct++;byMatter[x.materia].correct++;score+=wOf(x);}}

}

let AI=null; const aiMem={}, aiCtl={};
try{ if(window.claude&&window.claude.use) window.claude.use('sample').then(s=>{ AI=s||null; document.documentElement.classList.toggle('ai-on',!!AI); }).catch(()=>{}); }catch(_){}
const AI_ERR={not_granted:'O uso do Claude não foi permitido para este protótipo. Você pode mudar isso no menu de permissões do artefato.',rate_limited:'Muitas solicitações seguidas ou limite de uso atingido. Tente novamente em alguns minutos.',session_expired:'Sua sessão expirou. Entre de novo no Claude e tente outra vez.',sampling_disabled:'O Claude não está disponível nesta conta. O restante do app continua funcionando.',refused:'O Claude não respondeu a este pedido. Tente com outra questão.',invalid_json:'A resposta veio em um formato inesperado. Tente de novo.',empty_completion:'O Claude não devolveu texto. Tente de novo.',upstream_error:'Não foi possível falar com o Claude agora. O restante do app continua funcionando.'};
function aiMd(t){ const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>'); let h='',ul=false;
  for(const raw of String(t).split('\n')){ const l=raw.trim(), m=/^[-*•]\s+(.*)/.exec(l); if(m){ if(!ul){h+='<ul>';ul=true;} h+='<li>'+inl(m[1])+'</li>'; } else { if(ul){h+='</ul>';ul=false;} if(l) h+='<p>'+inl(l.replace(/^#+\s*/,''))+'</p>'; } }
  return h+(ul?'</ul>':''); }

  let h='<div class="ai-h">'+aiSpark+'<b>'+esc(m.title)+'</b>'+(m.state==='load'?'<button type="button" class="ai-link" data-ai-stop="'+esc(key)+'">Parar</button>':'<button type="button" class="ai-link" data-ai-close="'+esc(key)+'">Fechar</button>')+'</div>';

  if(m.state==='err') h+='<div class="ai-err" role="alert">'+esc(m.err)+' <button type="button" class="ai-link" data-ai="'+m.act+'" data-ai-arg="'+esc(m.arg)+'">Tentar novamente</button></div>';

async function aiRun(key,title,act,arg,prompt,o){ o=o||{}; if(!AI) return; if(aiCtl[key]) aiCtl[key].abort(); const ctl=new AbortController(); aiCtl[key]=ctl;
  const m=aiMem[key]={state:'load',title,html:'',act,arg}; aiPaint(key);
  const opt={signal:ctl.signal,modelTier:o.tier||'default'}; if(o.fresh) opt.cache={refresh:true};
  try{
    if(o.json){ const d=await AI.json(prompt,opt); const r=o.render(d); m.html=r.html; m.copy=r.copy||''; }
    else { opt.onText=({text})=>{ m.html=aiMd(text); aiPaint(key); }; const r=await AI(prompt,opt); m.html=aiMd(r.text)+(r.truncated?'<p class="ai-err">A resposta foi cortada. Peça de novo para tentar uma versão mais curta.</p>':''); m.copy=r.text; }
    m.state='done';
  }catch(e){ const c=(e&&e.code)||'upstream_error'; if(c==='cancelled'){ delete aiMem[key]; aiPaint(key); return; } m.state='err'; m.err=AI_ERR[c]||AI_ERR.upstream_error; if(c==='refused') m.html=''; else if(e&&e.text&&!o.json) m.html=aiMd(e.text); if(c==='not_granted'||c==='sampling_disabled'||c==='capability_disabled'||c==='not_declared'){ AI=null; document.documentElement.classList.remove('ai-on'); } }
  if(aiCtl[key]===ctl) delete aiCtl[key]; aiPaint(key); }
function aiQ(q){ const r=qSel(q); return 'Disciplina: '+(q.materia||'não informada')+'\nBanca: '+(q.banca||'não informada')+(q.ano?' · '+q.ano:'')+'\n\nEnunciado:\n'+q.enunciado+'\n\nAlternativas:\n'+Object.entries(q.alternativas).map(([l,v])=>l+') '+v).join('\n')+'\n\nGabarito oficial: '+q.gabarito+'\nResposta do aluno: '+(r?r+(r===q.gabarito?' (acertou)':' (errou)'):'ainda não respondeu'); }
function aiAct(act,arg,fresh){ if(!AI) return;
  if(act==='plan'){ const H=histAll(); if(!H.length) return; const ms={}; H.forEach(h=>{ if(!h.m) return; const b=ms[h.m]||(ms[h.m]={t:0,o:0}); b.t++; if(h.ok) b.o++; });
    const a=getAnswers(), pend={}; ((questionBank&&questionBank.questoes)||[]).forEach(q=>{ if(!a[q.n]) pend[q.materia]=(pend[q.materia]||0)+1; });
    const names=Object.keys(ms); if(!names.length){ aiMem.plan={state:'err',title:'Sugestão de revisão',html:'',err:'Ainda não há respostas com disciplina para analisar.',act,arg}; aiPaint('plan'); return; }
    const rows=names.map(n=>'- '+n+': '+ms[n].o+' acertos em '+ms[n].t+' tentativas; '+(pend[n]||0)+' questões ainda não resolvidas').join('\n');
    const p='Você é um mentor de estudos para concursos públicos (prova objetiva da banca FGV, cargo de Analista de TI). Abaixo está o desempenho real do aluno por disciplina. Escolha de 3 a 4 disciplinas para revisar primeiro, da mais urgente para a menos, considerando taxa de acerto, poucas tentativas e questões ainda não resolvidas.\n\n'+rows+'\n\nResponda apenas com um array JSON de objetos {"disciplina": "<nome exatamente como na lista acima>", "motivo": "<uma frase com os números>", "acao": "<uma ação concreta e curta, como refazer as questões erradas ou resolver mais 10 questões>"}. Em português do Brasil.';
    return aiRun('plan','Sugestão de revisão','plan','',p,{json:true,tier:'quick',fresh,render:d=>{ const L=(Array.isArray(d)?d:[]).filter(x=>x&&x.disciplina).slice(0,4); if(!L.length) throw {code:'invalid_json'}; return {html:'<div class="ai-plan">'+L.map(x=>{ const e=findEnt('disciplina',String(x.disciplina)); return '<a href="'+(e?'#/disciplina/'+e.id:'#/tipo/disciplina')+'"><b>'+esc(x.disciplina)+'</b><span>'+esc(x.motivo||'')+'</span><span>→ '+esc(x.acao||'')+'</span></a>'; }).join('')+'</div>',copy:L.map(x=>x.disciplina+': '+x.motivo+' — '+x.acao).join('\n')}; }}); }
  const q=qObjs().find(x=>x.id===arg); if(!q) return;
  if(act==='expl'){ const p='Você é um professor experiente de concursos públicos brasileiros. Explique a questão abaixo, em português do Brasil, para um aluno que acabou de respondê-la. Formato exato:\n1) Uma frase começando com "**Gabarito: X.**" dizendo por que essa alternativa está correta.\n2) Uma lista com uma linha por alternativa incorreta, no formato "- **B)** motivo curto".\n3) Uma última linha começando com "**Para lembrar:**" com um macete curto.\nSe o aluno errou, comece reconhecendo o raciocínio provável que levou à alternativa marcada. No máximo 200 palavras. Trate o gabarito oficial como verdade. Se faltar um texto ou tabela que o enunciado cita, diga isso em vez de inventar.\n\n'+aiQ(q);
    return aiRun('expl:'+q.id,'Explicação','expl',q.id,p,{fresh}); }
  if(act==='cards'){ const p='Crie 3 cartões de estudo (flashcards) em português do Brasil a partir do conceito cobrado na questão abaixo. Cada cartão testa a lembrança de um fato ou regra geral (não repita a questão literalmente). Frente: pergunta curta. Verso: resposta direta em até 25 palavras. Responda apenas com um array JSON de objetos {"frente": string, "verso": string}.\n\n'+aiQ(q);
    return aiRun('cards:'+q.id,'Cartões de estudo','cards',q.id,p,{json:true,fresh,render:d=>{ const L=(Array.isArray(d)?d:[]).filter(x=>x&&x.frente&&x.verso).slice(0,5); if(!L.length) throw {code:'invalid_json'}; return {html:'<div class="ai-cards">'+L.map(x=>'<div class="ai-card"><b>'+esc(x.frente)+'</b><span>'+esc(x.verso)+'</span></div>').join('')+'</div>',copy:L.map(x=>x.frente+'\t'+x.verso).join('\n')}; }}); }
}

function route(spaceChanged){
  document.querySelector('.main').classList.remove('study-mode');

  if(h0==='/lixeira'){ showTrash(); return; }
  if(h0==='/grafico'){ showGraph(); return; }
  if(h0==='/quadro'){ $('spaceRow').removeAttribute('aria-current'); showBoard(); return; }
  if(h0.startsWith('/questoes')||h0==='/simulado'){ location.replace('#/tipo/questao'); return; }
  if(h0==='/espaco'||h0.startsWith('/concurso/')||h0.startsWith('/questao/')||h0.startsWith('/tentativa/')||h0.startsWith('/resposta/')||h0.startsWith('/disciplina/')||h0.startsWith('/edicao/')||h0.startsWith('/cargo/')||h0.startsWith('/tipo/')||h0.startsWith('/valor/')||h0.startsWith('/orgao/')||h0.startsWith('/banca/')){ showObjs(h0); return; }
  document.querySelector('.main').classList.remove('on-board'); $('boardBtn').removeAttribute('aria-current'); $('spaceRow').removeAttribute('aria-current');
  const list=docsOf(space);
  if(!list.length){ blank(spaces.find(x=>x.id===space).name,'Este espaço ainda não tem objetos.<br><button class="cta" data-addv>+ Adicionar PDF</button>'); return; }
  const h=(location.hash||'').slice(1);
  let d=list.find(x=>x.id===h);
  if(!d&&h&&!h.startsWith('/')){ const lastId=store.get('last:'+space); blank('Não encontrado','<b>Documento não encontrado.</b><br>O link pode estar incorreto ou o documento foi excluído ou movido para outro espaço.<br>'+(list.some(x=>x.id===lastId)?'<a class="cta" href="#'+lastId+'">Abrir o último documento</a> ':'')+'<a class="cta alt" href="#/espaco">Ver todos os objetos</a>'); return; }
  if(!d&&h.startsWith('/')){ blank('Página não encontrada','<b>Esta página não existe.</b><br><a class="cta" href="#/espaco">Voltar ao início</a>'); return; }
  if(!d) d=list.find(x=>x.id===store.get('last:'+space))||list[0];
  store.set('last:'+space,d.id);
  if(cur&&cur.d.id===d.id){ cur.d=d; $('docTitle').textContent=d.t; if(pendingPage&&pendingPage.id===d.id&&cur.pdf){ const el=view.querySelector('[data-p="'+pendingPage.page+'"]'); if(el) view.scrollTop=el.offsetTop-24; pendingPage=null; } return; }
  if(isPhone()) app.classList.remove('open');
  open(d);
}

/* ---- Atalhos de Teclado para Resolução de Questões (Issues #17 & #19) ---- */
document.addEventListener('keydown', e => {
  const t = e.target;
  if(t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  
  // Teclas 1..5 ou A..E para marcar alternativa na questão ativa
  const keyUpper = e.key.toUpperCase();
  const altMap = {'1':'A','2':'B','3':'C','4':'D','5':'E','A':'A','B':'B','C':'C','D':'D','E':'E'};
  if(altMap[keyUpper]){
    const letter = altMap[keyUpper];
    const btn = document.querySelector('[data-qo-ans$="|' + letter + '"]:not([disabled])') ||
                document.querySelector('.s-choice[data-alt="' + letter + '"]') ||
                document.querySelector('.sc-alt[data-qo-ans$="|' + letter + '"]');
    if(btn){
      e.preventDefault();
      btn.click();
      return;
    }
  }

  // Tecla Enter para confirmar ou avançar
  if(e.key === 'Enter'){
    const cta = document.querySelector('.op-actions .op-btn[href*="/questao/"]:last-child') ||
                document.querySelector('[data-st-next]');
    if(cta){ e.preventDefault(); cta.click(); return; }
  }

  // Navegação J (próxima) / K (anterior)
  if(e.key === 'j' || e.key === 'J'){
    const nextBtn = document.querySelector('.op-actions a.op-btn[href*="/questao/"]:last-child');
    if(nextBtn){ e.preventDefault(); nextBtn.click(); return; }
  }
  if(e.key === 'k' || e.key === 'K'){
    const prevBtn = document.querySelector('.op-actions a.op-btn[href*="/questao/"]:first-child');
    if(prevBtn){ e.preventDefault(); prevBtn.click(); return; }
  }
});

addEventListener('drop',e=>{if(!tabDrag)return;const id=tabDrag;$('rpToggle').classList.remove('drop-target');if(e.clientX>innerWidth-70||e.target.closest('#rpanel')){tabDrag=null;e.preventDefault();e.stopImmediatePropagation();const t=WS.tabs.find(t=>t.id===id);if(t)rpOpenObj(t.hist[t.i]);}},true);
addEventListener('dragend',()=>{tabDrag=null;dropRef=null;clearDrop();$('rpToggle').classList.remove('drop-target');});
let panelDrag=null;
$('rpBody').addEventListener('dragstart',e=>{const h=e.target.closest('.rp-vh');if(!h)return;panelDrag=h.closest('[data-v]').dataset.v;e.dataTransfer.setData('application/x-exam-panel',panelDrag);});
$('rpBody').addEventListener('dragover',e=>{if(panelDrag)e.preventDefault();});
$('rpBody').addEventListener('drop',e=>{if(!panelDrag)return;e.preventDefault();e.stopPropagation();const sec=e.target.closest('[data-v]'),t=rpTab(),v=t.views.find(v=>v.id===panelDrag);if(sec&&v){const to=t.views.find(v=>v.id===sec.dataset.v);if(to!==v){t.views.splice(t.views.indexOf(v),1);t.views.splice(t.views.indexOf(to),0,v);wsSave();rpPaintAll();}}panelDrag=null;});
$('rpBody').addEventListener('dragend',()=>panelDrag=null);
let hoverTimer,preview,previewFor=null;
function clearPreview(){clearTimeout(hoverTimer);preview?.remove();preview=null;previewFor=null;}
function showPreview(el){const t=WS.tabs.find(t=>t.id===el.dataset.tab);if(!t||!el.isConnected)return;const lb=wsLabels()[WS.tabs.indexOf(t)];const n=nodeOf(t.hist[t.i]);preview=document.createElement('div');preview.className='ws-preview';preview.setAttribute('role','tooltip');preview.innerHTML='<b>'+esc(t.title||'Nova aba')+'</b>'+(lb!==(t.title||'Nova aba')?'<small>'+esc(lb)+'</small>':'')+'<small>'+esc(n&&n.sub?n.sub:'Espaço de trabalho · '+t.hist.length+' páginas no histórico')+'</small>'+(n&&n.text?'<p>'+esc(n.text.slice(0,140))+'</p>':'');document.body.appendChild(preview);const r=el.getBoundingClientRect();preview.style.left=Math.max(8,Math.min(r.left,innerWidth-264))+'px';preview.style.top=(r.bottom+8)+'px';}
$('wsTabList').addEventListener('pointerover',e=>{if(e.pointerType==='touch'||tabDrag)return;const el=e.target.closest('[data-tab]');if(!el){clearPreview();return;}if(el===previewFor)return;clearPreview();previewFor=el;hoverTimer=setTimeout(()=>showPreview(el),200);});
$('wsTabList').addEventListener('pointerleave',clearPreview);$('wsTabList').addEventListener('dragstart',clearPreview);$('wsTabList').addEventListener('click',clearPreview);
// Context actions work for every internal object link, including global navigation.
document.addEventListener('contextmenu',e=>{const a=e.target.closest('a[href^="#"]');if(!a||!a.closest('#nav,#view,#props'))return;const h=a.getAttribute('href');if(!isObjHref(h))return;e.preventDefault();e.stopImmediatePropagation();miniMenu(a,[{t:'Abrir na aba atual',ic:WI.obj,fn:()=>wsOpenMain(h)},{t:'Abrir em nova aba',ic:WI.plus,fn:()=>wsOpenTab(h)},{t:'Abrir no painel direito',ic:WI.panel,fn:()=>rpOpenObj(h)}]);},true);

wsPaint(); wsPaintNav(); applyRP(false);
{ let rq=0, rpAuto=false; const fit=()=>{ rq=0; wsPaint(); if(MQT.matches) return; const mainEl=document.querySelector('.main'); const w=mainEl.offsetWidth-(rpVisible()?0:(RP.w||340));
    if(rpVisible()&&w<560){ RP.open=false; rpAuto=true; applyRP(false); wsPaint(); } else if(!rpVisible()&&rpAuto&&w>=620){ RP.open=true; rpAuto=false; applyRP(false); wsPaint(); } };
  const kick=()=>{ if(!rq) rq=requestAnimationFrame(fit); }; addEventListener('resize',kick); if(window.ResizeObserver) new ResizeObserver(kick).observe($('wsTabList')); setTimeout(kick,50); }
{ const t=curTab(), h=location.hash||''; if(t.hist[t.i]!==h){ if(!h&&t.hist[t.i]){ wsSilent=true; setTimeout(()=>{ wsSilent=false; },500); location.hash=t.hist[t.i]; } else { pushHist(t,h); wsSave(); wsPaint(); wsPaintNav(); } } else afterNav(); }
if(typeof loadQuestions==='function'&&!questionBank) loadQuestions().then(()=>{ if(rpVisible()) rpRefresh(); }).catch(()=>{});
paintSpaces(); paintNav(); route(false); if(location.hash==='#/simulado/exec')beginExamTicker();
})();
