<main class="lab"><div class="tools" aria-label="Comparação de sistemas"><button data-style="neural" aria-pressed="true">Neural</button><button data-style="ledger" aria-pressed="false">Ledger</button><button data-style="focus" aria-pressed="false">Focus</button><button id="theme" class="switch" aria-pressed="false">Tema escuro</button><button id="fail" aria-pressed="false">Simular falha</button></div><p class="meta">Estudo isolado · questões ilustrativas · mesma tarefa nas três direções</p><div class="app" id="app" data-kind="neural" data-dark="false" data-collapsed="false"><aside class="nav"><div class="brand"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h8v16H3zM13 4h8v4h-8zM13 10h8v4h-8zM13 16h5v4h-5z"/></svg><strong>Exam App</strong><button class="iconbtn toggle" aria-label="Recolher navegação" aria-expanded="true"></button></div><nav class="navlist" aria-label="Concursos"></nav><div class="navwarn"></div></aside><div class="work"><header class="head"><button class="iconbtn mobiletoggle" aria-label="Abrir concursos" aria-expanded="false"></button><span class="context"></span><span class="pagecount"></span><button class="iconbtn theme-toggle" aria-label="Alternar tema"><svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.4A8.5 8.5 0 0 1 9.6 4 8.5 8.5 0 1 0 20 14.4Z"/></svg></button></header><div class="questions"></div></div><dialog class="drawer" aria-label="Concursos"><div class="brand"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h8v16H3zM13 4h8v4h-8zM13 10h8v4h-8zM13 16h5v4h-5z"/></svg><strong>Exam App</strong><button class="iconbtn close" aria-label="Fechar navegação"></button></div><nav class="navlist" aria-label="Concursos"></nav><div class="navwarn"></div></dialog></div><details class="spec"><summary>Especificações da direção</summary><p id="spec"></p></details></main>
<script>
const app=document.querySelector('#app'),work=app.querySelector('.work'),drawer=app.querySelector('.drawer'),qs=app.querySelector('.questions');
const icons={panel:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>',doc:'<path d="M6 3h9l4 4v14H6zM14 3v5h5M9 12h7M9 16h5"/>',folder:'<path d="M3 6h7l2 3h9v11H3zM7 13h10"/>',left:'<path d="m14 6-6 6 6 6"/>',right:'<path d="m10 6 6 6-6 6"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>'};const svg=n=>'<svg class="glyph" viewBox="0 0 24 24" aria-hidden="true">'+icons[n]+'</svg>';
const comps=['DATAPREV · 2026 · Analista (TI)','PPSA · 2025 · Analista (Sistemas)'];const items=[['Qual método HTTP é definido como seguro e idempotente?',['POST','GET','PATCH','CONNECT','Nenhuma das alternativas'],1],['Qual cláusula SQL filtra linhas antes do agrupamento?',['ORDER BY','HAVING','WHERE','GROUP BY','LIMIT'],2],['Qual status HTTP representa uma resposta bem-sucedida sem conteúdo?',['200','201','204','301','404'],2],['Qual estrutura de dados utiliza a ordem FIFO?',['Pilha','Fila','Árvore','Conjunto','Grafo'],1]];let comp=0,page=0,answers={},pendingNav=null,fail=false;const specs={neural:'Neural · 18 px controles, 24 px seleção, superfície lilás fria, texto 16/25, ritmo 28 px, ação 44 px, elevação só no drawer, transições 210 ms. Expressividade restrita à seleção e à resposta.',ledger:'Ledger · radius 2 px, tipografia Verdana 15/24, numeração em margem própria, ritmo 36 px, botão 38 px desktop, sem sombra, limites apenas funcionais, transições 100 ms. Acento vermelhão para ação e seleção.',focus:'Focus · radius 7 px, texto 17/27, coluna 670 px, ritmo 42 px, área lateral de baixa saliência, ação 44 px, sombra curta apenas no drawer, transições 150 ms. Acento de baixa cromaticidade.'};
function nav(){app.querySelectorAll('.navlist').forEach(n=>n.innerHTML=comps.map((s,i)=>`<button class="navitem" data-comp="${i}" title="${s}" aria-label="${s}" ${i===comp?'aria-current="page"':''}>${svg(i?'folder':'doc')}<span class="label"><b>${s.split(" · ")[0]}</b><small>${s.split(" · ").slice(1).join(" · ")}</small></span></button>`).join(''));app.querySelectorAll('.navwarn').forEach(n=>n.innerHTML=pendingNav?.type==='comp'?warning(): '');}
function warning(){return '<div class="warning" role="status">As respostas desta página serão descartadas.<br><button data-confirm>Continuar</button><button data-cancel>Cancelar</button></div>'}
function render(){nav();app.querySelector('.context').innerHTML=comps[comp].split(' · ')[0]+'<small>'+comps[comp].split(' · ').slice(1).join(' · ')+'</small>';app.querySelector('.pagecount').textContent=`Página ${page+1} de 2`;qs.innerHTML=items.slice(page*2,page*2+2).map(([stem,opts,correct],j)=>{let id=page*2+j,a=answers[id]||{},done=a.status==='done',busy=a.status==='pending',err=a.status==='error';return `<section class="q" aria-labelledby="q${id}"><h2 id="q${id}"><span class="word">Questão </span>${id+1}</h2><p class="stem">${stem}</p><fieldset class="options" aria-labelledby="q${id}" ${done||busy?'disabled':''}>${opts.map((o,k)=>{let selected=a.choice===k,ok=done&&correct===k,bad=done&&selected&&!ok;return `<label class="option ${selected?'chosen':''} ${ok?'correct':''} ${bad?'wrong':''} ${done?'locked':''}"><input type="radio" name="q${id}" data-id="${id}" value="${k}" ${selected?'checked':''}><span class="letter">${'ABCDE'[k]}.</span><span class="text">${o}${ok?'<span class="cue"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m3 8 3 3 7-7"/></svg>Correta</span>':bad?'<span class="cue"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8m0-8-8 8"/></svg>Sua resposta</span>':''}</span></label>`}).join('')}</fieldset><div class="action" aria-live="polite">${done?`<span class="result ${a.choice===correct?'ok':'bad'}">${a.choice===correct?'Resposta correta':'Resposta incorreta'}</span><span class="lockedtext">Resposta bloqueada</span>`:`<button class="primary" data-answer="${id}" ${a.choice===undefined||busy?'disabled':''}>${busy?'Enviando…':err?'Tentar novamente':'Responder'}</button>${err?'<span class="result error">Não foi possível confirmar. Sua escolha foi mantida.</span>':''}`}</div></section>`}).join('')+`<nav class="pagination" aria-label="Paginação"><button data-page="${page-1}" ${page===0?'disabled':''} aria-label="Anterior">${svg('left')}</button>${[0,1].map(i=>`<button data-page="${i}" ${i===page?'aria-current="page"':''}>${i+1}</button>`).join('')}<button data-page="${page+1}" ${page===1?'disabled':''} aria-label="Próxima">${svg('right')}</button></nav>${pendingNav?.type==='page'?warning():''}`;}
function go(type,n){if((type==='page'?page:comp)===n)return;if(Object.values(answers).some(a=>a.status==='pending'))return;if(Object.keys(answers).length){pendingNav={type,n};render();return}apply(type,n)}function apply(type,n){if(type==='page')page=n;else{comp=n;page=0}answers={};pendingNav=null;if(drawer.open)drawer.close();render();work.scrollTop=0;}
app.querySelector('.theme-toggle').onclick=()=>document.querySelector('#theme').click();app.querySelector('.toggle').innerHTML=svg('panel');app.querySelector('.mobiletoggle').innerHTML=svg('panel');app.querySelector('.close').innerHTML=svg('close');document.querySelector('#spec').textContent=specs.neural;render();
app.addEventListener('change',e=>{if(e.target.matches('input[type=radio]')){let id=+e.target.dataset.id,k=+e.target.value;answers[id]={choice:k};let group=e.target.closest('.options');group.querySelectorAll('.option').forEach(el=>el.classList.toggle('chosen',el.querySelector('input').checked));let b=qs.querySelector(`[data-answer="${id}"]`);b.disabled=false;}});
app.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;if(b.matches('.toggle')){app.dataset.collapsed=String(app.dataset.collapsed!=='true');b.setAttribute('aria-label',app.dataset.collapsed==='true'?'Expandir navegação':'Recolher navegação');b.setAttribute('aria-expanded',String(app.dataset.collapsed!=='true'));}else if(b.matches('.mobiletoggle')){drawer.showModal();b.setAttribute('aria-expanded','true');drawer.querySelector('.close').focus();}else if(b.matches('.close'))drawer.close();else if(b.dataset.comp!==undefined)go('comp',+b.dataset.comp);else if(b.dataset.page!==undefined)go('page',+b.dataset.page);else if(b.hasAttribute('data-confirm')&&pendingNav)apply(pendingNav.type,pendingNav.n);else if(b.hasAttribute('data-cancel')){pendingNav=null;render()}else if(b.dataset.answer!==undefined){let id=+b.dataset.answer,a=answers[id];if(!a||a.status==='done'||a.status==='pending')return;a.status='pending';render();setTimeout(()=>{if(answers[id]!==a)return;a.status=fail?'error':'done';if(fail){fail=false;document.querySelector('#fail').setAttribute('aria-pressed','false')}render();},350)}});
document.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{app.dataset.kind=b.dataset.style;document.querySelectorAll('[data-style]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelector('#spec').textContent=specs[b.dataset.style]});document.querySelector('#theme').onclick=e=>{let d=app.dataset.dark!=='true';app.dataset.dark=String(d);e.target.setAttribute('aria-pressed',String(d));e.target.textContent=d?'Tema claro':'Tema escuro'};document.querySelector('#fail').onclick=e=>{fail=!fail;e.target.setAttribute('aria-pressed',String(fail))};drawer.addEventListener('close',()=>{const b=app.querySelector('.mobiletoggle');b.setAttribute('aria-expanded','false');if(b.getClientRects().length)b.focus();});drawer.addEventListener('click',e=>{if(e.target===drawer){let r=drawer.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right)drawer.close()}});
</script></html>
