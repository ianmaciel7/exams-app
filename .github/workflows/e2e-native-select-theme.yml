name: E2E Native Select Theme (Windows)

on:
  pull_request:
    branches: [dev]
    paths:
      - 'prototypes/exam-app-0.1.1/index.html'
      - 'tests/native-select-theme.e2e.mjs'
      - '.github/workflows/e2e-native-select-theme.yml'

permissions:
  contents: read

jobs:
  windows-select-theme:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Playwright Chromium
        shell: pwsh
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Serve static Exam App prototype
        shell: pwsh
        run: |
          Start-Process -FilePath python -ArgumentList '-m http.server 8765 --directory prototypes' -RedirectStandardOutput "$env:RUNNER_TEMP\exam-server.log" -RedirectStandardError "$env:RUNNER_TEMP\exam-server.err" -PassThru | Out-Null
          $ready = $false
          for ($i = 0; $i -lt 20; $i++) {
            try {
              $res = Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:8765/exam-app-0.1.1/index.html'
              if ($res.StatusCode -eq 200) { $ready = $true; break }
            } catch {}
            Start-Sleep -Seconds 1
          }
          if (-not $ready) { throw 'Prototype HTTP server did not respond' }
      - name: Verify explicit and automatic themes, native values and mobile viewport
        run: node tests/native-select-theme.e2e.mjs
      - name: Upload real Chromium captures and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue120-native-select-windows-chromium
          path: |
            prototypes/board-exam-app/assets/issue120_*.png
            prototypes/board-exam-app/issue120_e2e.json
          if-no-files-found: warn
