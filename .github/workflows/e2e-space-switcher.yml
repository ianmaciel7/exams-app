name: E2E SpaceSwitcher Interactions and Evidence

on:
  pull_request:
    branches: [dev]
    paths:
      - 'prototypes/exam-app-0.1.1/index.html'
      - 'tests/space-switcher.test.mjs'
      - 'tests/space-switcher.e2e.mjs'
      - 'scripts/append-space-switcher-board.py'
      - '.github/workflows/e2e-space-switcher.yml'

permissions:
  contents: write

jobs:
  space-switcher:
    if: github.head_ref == 'feat/138-searchable-space-switcher' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static guards and prototype script syntax
        run: node --test tests/space-switcher.test.mjs tests/study-navigation.test.mjs
      - name: Install Chromium Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Reproduce baseline, test interactions and persist genuine screenshots
        shell: bash
        run: |
          set -euo pipefail
          if test -f prototypes/board-exam-app/issue138_spaces_e2e.json; then
            echo 'Genuine screenshots already versioned; do not create new captures.'
            exit 0
          fi
          git worktree add --detach /tmp/exams-before-138 b410b044cac80819d952744b29072744d6df59b9
          python3 -m http.server 8765 --directory prototypes >/tmp/exams-after-138.log 2>&1 &
          python3 -m http.server 8766 --directory /tmp/exams-before-138/prototypes >/tmp/exams-before-138.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/exam-app-0.1.1/index.html -o /dev/null &&
               curl -fsS http://127.0.0.1:8766/exam-app-0.1.1/index.html -o /dev/null; then break; fi
            sleep 1
          done
          node tests/space-switcher.e2e.mjs
          python3 scripts/append-space-switcher-board.py
          npm run board
          grep -q '44. SpaceSwitcher' prototypes/board-exam-app/BOARD.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prototypes/board-exam-app/board.json prototypes/board-exam-app/BOARD.md prototypes/board-exam-app/issue138_spaces_e2e.json
          git add prototypes/board-exam-app/assets/issue138_*.png
          if ! git diff --cached --quiet; then
            git commit -m 'test(sidebar): persist Issue #138 real SpaceSwitcher evidence'
            git push origin "HEAD:${{ github.head_ref }}"
          fi
      - name: Upload visual and structural evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue138-space-switcher
          path: |
            prototypes/board-exam-app/assets/issue138_*.png
            prototypes/board-exam-app/issue138_spaces_e2e.json
          if-no-files-found: warn
