name: E2E Responsive Home CTA and Evidence

on:
  pull_request:
    branches: [dev]
    paths:
      - 'prototypes/exam-app-0.1.1/index.html'
      - 'tests/home-icon-contract.test.mjs'
      - 'tests/home-responsive.e2e.mjs'
      - 'scripts/append-responsive-home-board.py'
      - '.github/workflows/e2e-responsive-home.yml'

permissions:
  contents: write

jobs:
  responsive-home:
    if: github.head_ref == 'fix/132-responsive-home-actions-timer' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static tests
        run: node --test tests/home-icon-contract.test.mjs tests/study-navigation.test.mjs
      - name: Install Chromium Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Reproduce baseline, verify Home across 12 widths, and persist board
        shell: bash
        run: |
          set -euo pipefail
          if test -f prototypes/board-exam-app/issue132_home_e2e.json; then
            echo "Persistent evidence already checked into this branch; avoid recreating screenshots."
            exit 0
          fi
          git worktree add --detach /tmp/exams-before-132 8bedd3aa05f4987cf10453c578662e673e4464f9
          python3 -m http.server 8765 --directory prototypes >/tmp/exams-after-132.log 2>&1 &
          python3 -m http.server 8766 --directory /tmp/exams-before-132/prototypes >/tmp/exams-before-132.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/exam-app-0.1.1/index.html -o /dev/null &&
               curl -fsS http://127.0.0.1:8766/exam-app-0.1.1/index.html -o /dev/null; then break; fi
            sleep 1
          done
          node tests/home-responsive.e2e.mjs
          python3 scripts/append-responsive-home-board.py
          npm run board
          grep -q "40. Responsividade Home" prototypes/board-exam-app/BOARD.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototypes/board-exam-app/board.json prototypes/board-exam-app/BOARD.md prototypes/board-exam-app/issue132_home_e2e.json
          git add prototypes/board-exam-app/assets/issue132_*.png
          if ! git diff --cached --quiet; then
            git commit -m "test(ui): persist Issue #132 real Chromium Home before/after evidence"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue132-responsive-home-before-after
          path: |
            prototypes/board-exam-app/assets/issue132_*.png
            prototypes/board-exam-app/issue132_home_e2e.json
          if-no-files-found: warn
