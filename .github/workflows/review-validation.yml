name: Review Validation

# Current-state review checks; archived audit reports are not required.
on:
  workflow_dispatch:

env:
  HUSKY: "0"

permissions:
  contents: read

concurrency:
  group: review-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Current source and documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Current source and regression checks
        run: pnpm verify:fast
      - name: Documentation links and skill inventory
        run: pnpm check:docs
      - name: Documentation spelling
        run: pnpm check:spelling
      - name: Documentation Markdown
        run: pnpm check:markdown
