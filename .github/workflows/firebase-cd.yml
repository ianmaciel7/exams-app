name: Firebase CD

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Firebase production release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      FIREBASE_APP_HOSTING_BACKEND_ID: ${{ vars.FIREBASE_APP_HOSTING_BACKEND_ID }}
      FIREBASE_APP_HOSTING_LOCATION: ${{ vars.FIREBASE_APP_HOSTING_LOCATION }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_RELEASE_BRANCH: ${{ vars.FIREBASE_RELEASE_BRANCH }}
      GOOGLE_SERVICE_ACCOUNT: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
      GOOGLE_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Validate release configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Only stable Semantic Versioning tags (vX.Y.Z) can deploy production." >&2
            exit 1
          fi

          for variable_name in \
            FIREBASE_APP_HOSTING_BACKEND_ID \
            FIREBASE_APP_HOSTING_LOCATION \
            FIREBASE_PROJECT_ID \
            FIREBASE_RELEASE_BRANCH \
            GOOGLE_SERVICE_ACCOUNT \
            GOOGLE_WORKLOAD_IDENTITY_PROVIDER; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "Missing production environment variable: $variable_name" >&2
              exit 1
            fi
          done

          git fetch origin "$FIREBASE_RELEASE_BRANCH"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$FIREBASE_RELEASE_BRANCH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:fast
      - name: Install Functions dependencies
        run: npm ci --prefix functions --ignore-scripts
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: access_token
          create_credentials_file: true
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
          service_account: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
      - name: Set the release tag for the App Hosting build
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          backend_name="projects/$FIREBASE_PROJECT_ID/locations/$FIREBASE_APP_HOSTING_LOCATION/backends/$FIREBASE_APP_HOSTING_BACKEND_ID"
          backend_url="https://firebaseapphosting.googleapis.com/v1/$backend_name"
          backend_file="$(mktemp)"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" \
            "$backend_url" > "$backend_file"

          override_env="$(jq -c --arg tag "$GITHUB_REF_NAME" '
            (.overrideEnv // [] | map(select(.variable != "NEXT_PUBLIC_GIT_TAG"))) +
            [{variable: "NEXT_PUBLIC_GIT_TAG", value: $tag, availability: ["BUILD"]}]
          ' "$backend_file")"
          payload="$(jq -cn --argjson override_env "$override_env" '{overrideEnv: $override_env}')"
          operation="$(curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$backend_url?updateMask=override_env")"
          operation_name="$(jq -r '.name' <<< "$operation")"

          for _ in {1..60}; do
            status="$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" \
              "https://firebaseapphosting.googleapis.com/v1/$operation_name")"
            if [[ "$(jq -r '.done // false' <<< "$status")" == "true" ]]; then
              jq --exit-status 'has("error") | not' <<< "$status" > /dev/null
              exit 0
            fi
            sleep 2
          done

          echo "Timed out while configuring NEXT_PUBLIC_GIT_TAG for App Hosting." >&2
          exit 1
      - name: Deploy Functions and Firebase security rules
        run: >-
          pnpm dlx firebase-tools@15.34.1 deploy
          --project "$FIREBASE_PROJECT_ID"
          --only functions,firestore,database,storage
          --non-interactive
      - name: Create App Hosting rollout for the release commit
        run: >-
          pnpm dlx firebase-tools@15.34.1 apphosting:rollouts:create
          "$FIREBASE_APP_HOSTING_BACKEND_ID"
          --project "$FIREBASE_PROJECT_ID"
          --git-commit "$GITHUB_SHA"
          --force
          --non-interactive
