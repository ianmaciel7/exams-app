name: Validate study prototype

on:
  pull_request:
    branches: [dev]
    paths:
      - 'prototypes/exam-app-0.1.1/index.html'
      - 'tests/study-navigation.test.mjs'
      - '.github/workflows/validate-prototype.yml'
  push:
    branches: [dev]
    paths:
      - 'prototypes/exam-app-0.1.1/index.html'
      - 'tests/study-navigation.test.mjs'
      - '.github/workflows/validate-prototype.yml'

permissions:
  contents: read

jobs:
  static-prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/study-navigation.test.mjs
