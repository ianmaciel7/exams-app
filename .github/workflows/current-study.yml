name: Current study evidence
on:
  push:
    branches: [dev]
    paths:
      - 'prototypes/current-study/**'
      - '.github/workflows/current-study.yml'
      - '.github/actions/setup-board-browser/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ./.github/actions/setup-board-browser
      - name: Reproduce reviewed study and verify representative interactions
        run: NODE_PATH=/tmp/board-browser/node_modules node prototypes/current-study/capture.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-evidence
          path: current-evidence/
          if-no-files-found: error
          retention-days: 30
