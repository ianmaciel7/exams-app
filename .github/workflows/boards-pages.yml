name: Exam App Playground — GitHub Pages
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: exam-app-boards-pages
  # Finish in-flight evidence and deployment before starting the latest queued revision.
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check board integrity
        run: node scripts/check-boards.mjs
      - name: Test High-Fidelity structural QA
        run: node --test scripts/high-fidelity-qa.test.mjs scripts/fixed-paper-contrast.test.mjs
      - name: Check provisional identity contrast and token parity
        run: node scripts/check-identity-contrast.mjs
      - name: Test release projections
        run: node --test scripts/sync-release-state.test.mjs
      - name: Test runtime resolver
        run: node --test scripts/open-artifact-runtime.test.mjs
      - name: Install verified Open Artifact v0.17.0
        run: node scripts/open-artifact-runtime.mjs install
      - name: Verify installed type registry
        run: node scripts/open-artifact-runtime.mjs cli types list
      - name: Open native boards
        run: node scripts/open-boards.mjs | tee /tmp/board-urls
      - name: Capture board evidence and thumbnails
        run: |
          npm install --prefix /tmp/board-browser playwright
          /tmp/board-browser/node_modules/.bin/playwright install chromium
          mkdir -p _site/boards
          touch _site/.nojekyll
          NODE_PATH=/tmp/board-browser/node_modules node scripts/capture-board-portal.cjs
      - name: Verify capture provenance
        run: |
          node -e 'const m=require("./_site/manifest.json"); if(m.commit!==process.env.GITHUB_SHA || m.boards.length!==11 || m.boards.some(b=>!b.images.light||!b.images.dark)) throw Error("Capture manifest mismatch")'
      - name: Upload downloadable board evidence
        uses: actions/upload-artifact@v4
        with:
          name: exam-app-board-evidence
          path: |
            _site/boards/
            _site/manifest.json
          retention-days: 7
          if-no-files-found: error
      - name: Build and validate native Playground
        timeout-minutes: 15
        run: NODE_PATH=/tmp/board-browser/node_modules node scripts/build-native-playground.cjs
      - name: Upload rendered accessibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: rendered-workspace-color-audit
          path: _site/qa/rendered-color-audit.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-public:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify actual published revision and 14 artifact routes
        run: |
          npm install --prefix /tmp/board-browser playwright
          /tmp/board-browser/node_modules/.bin/playwright install chromium
          NODE_PATH=/tmp/board-browser/node_modules node scripts/verify-public-playground.cjs
