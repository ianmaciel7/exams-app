name: E2E Graph Motion Accessibility

on:
  pull_request:
    branches: [dev]
    paths:
      - 'prototypes/exam-app-0.1.1/index.html'
      - 'tests/motion-graph.test.mjs'
      - 'tests/motion-graph.e2e.mjs'
      - 'scripts/append-graph-motion-board.py'
      - '.github/workflows/e2e-graph-motion.yml'

permissions:
  contents: write

jobs:
  graph-motion:
    if: github.head_ref == 'test/128-motion-graph-browser' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise graph scheduler in Node VM
        run: node --test tests/motion-graph.test.mjs
      - name: Install Chromium Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Browser graph QA and real planning board evidence
        shell: bash
        run: |
          set -euo pipefail
          if test -f prototypes/board-exam-app/issue128_motion_e2e.json; then
            echo 'Existing evidence is versioned; avoiding duplicate snapshots.'
            exit 0
          fi
          python3 -m http.server 8765 --directory prototypes >/tmp/exams-graph.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/exam-app-0.1.1/index.html -o /dev/null; then break; fi
            sleep 1
          done
          node tests/motion-graph.e2e.mjs
          python3 scripts/append-graph-motion-board.py
          npm run board
          grep -q '41. Grafo' prototypes/board-exam-app/BOARD.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prototypes/board-exam-app/board.json prototypes/board-exam-app/BOARD.md prototypes/board-exam-app/issue128_motion_e2e.json
          git add prototypes/board-exam-app/assets/issue128_*.png
          if ! git diff --cached --quiet; then
            git commit -m 'test(motion): preserve measured Issue #128 graph browser evidence'
            git push origin "HEAD:${{ github.head_ref }}"
          fi
      - name: Upload screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue128-graph-motion-evidence
          path: |
            prototypes/board-exam-app/assets/issue128_*.png
            prototypes/board-exam-app/issue128_motion_e2e.json
          if-no-files-found: warn
