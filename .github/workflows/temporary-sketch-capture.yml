name: Validate marker sketch preview
on:
  push:
    branches: [capture/sketch-controls-20261126]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check board integrity and preset
        run: |
          node --test scripts/marker-sketch.test.mjs scripts/marker-sketch-ink.test.mjs
          node scripts/check-boards.mjs
          node --test scripts/check-boards.test.mjs
      - name: Download official Open Artifact release
        run: |
          curl -fsSL https://github.com/JimLiu/open-artifact/releases/download/v0.16.3/open-artifact-plugins.zip -o /tmp/open-artifact.zip
          unzip -q /tmp/open-artifact.zip -d /tmp/open-artifact
      - name: Open original boards
        run: |
          cli=$(find /tmp/open-artifact -path '*/whiteboard/scripts/cli.mjs' | grep '/codex/' | head -1)
          if [ -z "$cli" ]; then cli=$(find /tmp/open-artifact -path '*/whiteboard/scripts/cli.mjs' | head -1); fi
          test -n "$cli"
          export OPEN_ARTIFACT_WHITEBOARD_CLI="$cli"
          node scripts/open-boards.mjs | tee /tmp/board-urls
          grep '^sketch:' /tmp/board-urls | cut -d' ' -f2- > /tmp/sketch-url
      - name: Capture both native color schemes
        run: |
          npm install --prefix /tmp/sketch-browser playwright
          /tmp/sketch-browser/node_modules/.bin/playwright install chromium
          mkdir -p /tmp/capture
          cat > /tmp/sketch-browser/capture.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            for(const theme of ['light','dark']){
              const page=await browser.newPage({viewport:{width:1920,height:1080},deviceScaleFactor:1,colorScheme:theme});
              page.on('pageerror',e=>console.log('PAGE ERROR',e.message));
              await page.goto(fs.readFileSync('/tmp/sketch-url','utf8').trim(),{waitUntil:'domcontentloaded'});
              await page.evaluate(theme=>document.documentElement.dataset.theme=theme,theme);
              await page.waitForTimeout(4500);
              await page.evaluate(()=>document.fonts.ready);
              await page.waitForFunction(()=>document.querySelectorAll('.wb-stroke-ink[data-exam-sketch-ink]').length>0);
              const ink=await page.evaluate(()=>({all:document.querySelectorAll('.wb-stroke-ink').length,styled:document.querySelectorAll('.wb-stroke-ink[data-exam-sketch-ink]').length,icons:['ic_search_lens','ic_toggle_exp_box','ic_c_search_lens','ic_c_toggle_box'].map(id=>{const el=document.querySelector('svg[data-wb-id="'+id+'"]');return {id,styled:el?.querySelector('.wb-stroke-ink')?.hasAttribute('data-exam-sketch-ink'),different:el?.querySelector('.wb-stroke-ink')?.getAttribute('d')!==el?.querySelector('.wb-hit')?.getAttribute('d')};})}));
              console.log('Sketch ink coverage',JSON.stringify(ink));
              if(ink.styled<ink.all*0.90||ink.icons.some(i=>!i.styled||!i.different))throw new Error('Incomplete sketch ink coverage');
              const status=await page.evaluate(()=>({theme:document.documentElement.dataset.theme,marker:document.documentElement.hasAttribute('data-exam-marker-sketch'),font:document.fonts.check('16px ExamMarker'),title:document.title}));
              console.log(status);
              if(!status.marker||!status.font||status.theme!==theme)throw new Error('Marker or theme did not load');
              await page.screenshot({path:'/tmp/capture/overview-'+theme+'.png'});
              await page.screenshot({path:'/tmp/capture/first-'+theme+'.png'});
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/sketch-browser/capture.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: sketch-component-affordances
          path: /tmp/capture/*.png
          retention-days: 2
          if-no-files-found: error
