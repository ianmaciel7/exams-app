# Firebase Web SDK configuration for the production App Hosting backend.
# These values are public browser configuration (they ship in the client bundle), not credentials.
# Regenerate them from the Terraform output `firebase_web_config` (see infra/README.md).
# The Web API key is the exception to "copy the value": it lives in Secret Manager
# (`firebase-web-api-key`) so no key-shaped literal sits in the repository.
env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: firebase-web-api-key
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:472609280568:web:942dac9f826f8772058ccd"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "exams-app-prod.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_DATABASE_URL
    value: "https://exams-app-prod-default-rtdb.firebaseio.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "exams-app-prod"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "exams-app-prod.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_GOOGLE_ENABLED
    value: "true"
    availability:
      - BUILD
      - RUNTIME
  # Release version shown in the app. Keep it equal to package.json: the release workflow
  # rejects a release whose tag differs, and `pnpm check:release` guards it.
  - variable: NEXT_PUBLIC_GIT_TAG
    value: "v0.1.9"
    availability:
      - BUILD
