<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mobile Closed · Light</title>
  <script src="./support.js"></script>
  <link rel="stylesheet" href="ds/examapp/tokens.css">
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: var(--font-sans); }
    button:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
  </style>
</helmet>
<div data-theme="light" style="width: 390px; min-height: 844px; box-sizing: border-box; background: var(--ground); color: var(--ink); font-family: var(--font-sans); position: relative; display: flex; flex-direction: column;">
  <header style="padding: 16px 20px 8px; display: flex; align-items: center; gap: 8px;">
    <button type="button" onClick="{{openDrawer}}" aria-label="Open navigation" aria-expanded="{{drawerOpen}}" style="width: 44px; height: 44px; margin-left: -10px; border: 0; border-radius: var(--radius-control); background: transparent; color: var(--ink); display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <rect x="2" y="3" width="16" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/>
        <path d="M7 3V17" stroke="currentColor" stroke-width="1.5"/>
      </svg>
    </button>
    <img src="/_blob/16f589d5ac13abfba5dc8fbb104e299f" alt="Exam App provisional logo" style="height: 26px; width: auto; display: block;">
  </header>

  <div style="padding: 4px 20px 16px; border-bottom: 1px solid color-mix(in srgb, var(--ink) 10%, transparent);">
    <span style="font: var(--text-label); color: var(--muted);">DATAPREV · 2026 · Analyst (IT)</span>
  </div>

  <main style="padding: 20px 20px 32px; display: flex; flex-direction: column; gap: 24px;">
    <section aria-labelledby="m1-heading" style="display: flex; flex-direction: column; gap: 10px;">
      <h2 id="m1-heading" style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 600; color: var(--ink);">Question 1</h2>
      <p style="margin: 0; font-size: 16px; line-height: 24px; color: var(--ink);">Which HTTP method is defined as safe and idempotent?</p>
      <div role="radiogroup" aria-labelledby="m1-heading" style="display: flex; flex-direction: column; gap: 4px; margin-top: 4px;">
        <sc-for list="{{q1Options}}" as="opt" hint-placeholder-count="5">
          <button type="button" role="radio" aria-checked="{{opt.checked}}" onClick="{{opt.pick}}" style="width: 100%; min-height: 44px; border: 0; border-radius: var(--radius-control); padding: 10px 12px; background: {{opt.bg}}; color: var(--ink); display: flex; align-items: center; gap: 10px; text-align: left; cursor: pointer; font-size: 16px; line-height: 24px;">
            <span aria-hidden="true" style="width: 18px; height: 18px; border-radius: 999px; border: 2px solid {{opt.ringColor}}; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--ground);">
              <sc-if value="{{opt.checked}}" hint-placeholder-val="{{false}}">
                <span style="width: 8px; height: 8px; border-radius: 999px; background: var(--brand);"></span>
              </sc-if>
            </span>
            <span>{{opt.text}}</span>
          </button>
        </sc-for>
      </div>
      <div style="margin-top: 6px;">
        <button type="button" disabled="{{q1Disabled}}" style="width: 112px; height: 44px; border: 0; border-radius: var(--radius-control); background: {{q1BtnBg}}; color: {{q1BtnInk}}; font: var(--text-label); cursor: pointer;">Answer</button>
      </div>
    </section>

    <section aria-labelledby="m2-heading" style="display: flex; flex-direction: column; gap: 10px;">
      <h2 id="m2-heading" style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 600; color: var(--ink);">Question 2</h2>
      <p style="margin: 0; font-size: 16px; line-height: 24px; color: var(--ink);">Which SQL clause filters rows before grouping?</p>
    </section>
  </main>

  <sc-if value="{{drawerOpen}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; background: color-mix(in srgb, var(--ink) 40%, transparent); display: flex; z-index: 20;">
      <aside role="dialog" aria-modal="true" aria-label="Competitions" style="width: 304px; height: 100%; box-sizing: border-box; background: var(--ground); border-right: 1px solid color-mix(in srgb, var(--ink) 14%, transparent); padding: 16px 12px; display: flex; flex-direction: column; gap: 16px;">
        <div style="display: flex; align-items: center; gap: 8px; padding-left: 8px;">
          <button type="button" onClick="{{closeDrawer}}" aria-label="Close navigation" style="width: 44px; height: 44px; margin-left: -10px; border: 0; border-radius: var(--radius-control); background: transparent; color: var(--ink); display: flex; align-items: center; justify-content: center; cursor: pointer;">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M5 5L15 15M15 5L5 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </button>
          <img src="/_blob/16f589d5ac13abfba5dc8fbb104e299f" alt="Exam App provisional logo" style="height: 26px; width: auto; display: block;">
        </div>
        <nav aria-label="Competition list" style="display: flex; flex-direction: column; gap: 8px;">
          <div style="padding: 12px; border-radius: var(--radius-control); background: var(--tint); font: var(--text-label); color: var(--ink);">
            DATAPREV · 2026<br>Analyst (Information Technology)
          </div>
          <div style="padding: 12px; border-radius: var(--radius-control); font: var(--text-label); font-weight: 400; color: var(--ink);">
            PPSA · 2025<br>Analyst (Systems Engineering)
          </div>
        </nav>
        <div style="padding: 12px; border-radius: var(--radius-control); background: color-mix(in srgb, var(--ink) 5%, var(--ground)); color: var(--ink); font-size: 13px; line-height: 18px;">
          Changing competitions clears answers on this page.
        </div>
      </aside>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { drawerOpen: false, q1Selected: 1 };
  }
  renderVals() {
    const q1Options = ['A. POST', 'B. GET', 'C. PATCH', 'D. CONNECT', 'E. None of the above'].map((text, idx) => {
      const checked = idx === this.state.q1Selected;
      return {
        text,
        checked,
        bg: checked ? 'var(--tint)' : 'transparent',
        ringColor: checked ? 'var(--brand)' : 'var(--muted)',
        pick: () => this.setState({ q1Selected: idx })
      };
    });
    const dis = this.state.q1Selected < 0;
    return {
      drawerOpen: this.state.drawerOpen,
      openDrawer: () => this.setState({ drawerOpen: true }),
      closeDrawer: () => this.setState({ drawerOpen: false }),
      q1Options,
      q1Disabled: dis,
      q1BtnBg: dis ? 'color-mix(in srgb, var(--ink) 8%, var(--ground))' : 'var(--brand)',
      q1BtnInk: dis ? 'var(--muted)' : 'var(--on-brand)'
    };
  }
}
</script>
</body>
</html>
