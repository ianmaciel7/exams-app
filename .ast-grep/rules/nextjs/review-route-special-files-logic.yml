id: review-route-special-files-logic
language: tsx
files:
  - src/app/**/page.tsx
  - src/app/**/layout.tsx
  - src/app/**/template.tsx
  - src/app/**/not-found.tsx
  - src/app/**/loading.tsx
  - src/app/**/default.tsx
ignores:
  - "**/*.test.tsx"
severity: error
message: Route entrypoints must not call hooks; use `await getTranslations()` from `next-intl/server` for server-rendered copy.
note: |
  This is a project policy requiring thin route entrypoints, not a restriction
  imposed by Next.js on every page or layout.
  Prefer server-side data loading and framework generators in route files.
rule:
  all:
    - kind: call_expression
    - has:
        field: function
        regex: '(^|\.)use[A-Z]'
