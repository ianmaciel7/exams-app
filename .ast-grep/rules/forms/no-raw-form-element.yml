id: no-raw-form-element
language: tsx
files:
  - src/components/**/*.tsx
  - src/app/**/*.tsx
ignores:
  - "**/*.test.tsx"
  - "**/*.stories.tsx"
  - "src/components/ui/[!e]*.tsx"
  - "src/components/ui/e[!x]*.tsx"
  - src/components/ai-elements/**
  # Firebase UI forms still use the plain shadcn Field. Remove this line when
  # the auth refactor (PR #37) has merged and they are migrated to FormField.
  - src/components/firebase/**
severity: error
message: Use Form from @/components/ui/extensions/form instead of a raw <form>.
note: |
  Base UI Form renders `noValidate`, so the app owns the messages instead of the
  browser bubble, and it moves focus to the first invalid control on submit
  (WCAG 3.3.1, WAI Forms Tutorial). A raw <form> loses both.
rule:
  any:
    - kind: jsx_opening_element
    - kind: jsx_self_closing_element
  has:
    field: name
    regex: ^form$
