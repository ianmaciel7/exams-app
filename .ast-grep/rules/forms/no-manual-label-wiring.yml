id: no-manual-label-wiring
language: tsx
files:
  - src/components/**/*.tsx
  - src/app/**/*.tsx
ignores:
  - "**/*.test.tsx"
  - "**/*.stories.tsx"
  - "src/components/ui/[!e]*.tsx"
  - "src/components/ui/e[!x]*.tsx"
  - src/components/ai-elements/**
  # See no-raw-form-element: remove after the auth refactor (PR #37) merges.
  - src/components/firebase/**
severity: error
message: Use FormField, FormFieldLabel and FormFieldError so Base UI links label, description and error to the control, instead of FieldLabel htmlFor or FieldError.
note: |
  The shadcn Field is a plain div. A FieldLabel with htmlFor and a FieldError
  next to an Input leave aria-describedby unset, so a screen reader never reads
  the error when the control is focused (WCAG 1.3.1, 3.3.1, 4.1.2). Base UI
  Field.Root, Label, Description and Error set for, aria-labelledby,
  aria-describedby and aria-invalid on the control automatically. Use
  src/components/ui/extensions/form-field.tsx.
rule:
  any:
    - pattern: <FieldError $$$ATTRS />
    - pattern: <FieldError $$$ATTRS>$$$CHILDREN</FieldError>
    - all:
        - any:
            - kind: jsx_opening_element
            - kind: jsx_self_closing_element
        - has:
            field: name
            regex: ^FieldLabel$
        - has:
            kind: jsx_attribute
            regex: ^htmlFor
