id: menu-item-on-click
language: tsx
files:
  - src/components/**/*.tsx
  - src/app/**/_components/**/*.tsx
ignores:
  - "**/*.test.tsx"
  - "**/*.stories.tsx"
  - "src/components/ui/[!e]*.tsx"
  - "src/components/ui/e[!x]*.tsx"
severity: error
message: Base UI menu items fire onClick; onSelect is a Radix API and never runs here.
note: |
  Menu.Item, CheckboxItem and RadioItem handle activation (pointer and
  keyboard) through onClick. Use closeOnClick={false} to keep the menu open,
  as https://base-ui.com/react/components/menu documents.
rule:
  kind: jsx_attribute
  has:
    kind: property_identifier
    regex: ^onSelect$
  inside:
    any:
      - kind: jsx_opening_element
      - kind: jsx_self_closing_element
    has:
      field: name
      regex: ((Menu|Menubar)(Item|CheckboxItem|RadioItem|SubTrigger)|^Menu\.\w*Item)$
