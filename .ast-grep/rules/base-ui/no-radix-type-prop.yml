id: no-radix-type-prop
language: tsx
files:
  - src/components/**/*.tsx
  - src/app/**/_components/**/*.tsx
ignores:
  - "**/*.test.tsx"
  - "**/*.stories.tsx"
  - src/components/ui/*.tsx
severity: error
message: Base UI ToggleGroup and Accordion use the boolean multiple prop, not type="single" or type="multiple".
note: |
  The Radix type prop is not part of the Base UI API, so the group silently
  keeps its default behavior. Use multiple (default false).
rule:
  kind: jsx_attribute
  has:
    kind: property_identifier
    regex: ^type$
  inside:
    any:
      - kind: jsx_opening_element
      - kind: jsx_self_closing_element
    has:
      field: name
      regex: ^(ToggleGroup|Accordion)(\.Root)?$
