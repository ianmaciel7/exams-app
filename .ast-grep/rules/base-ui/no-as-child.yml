id: no-as-child
language: tsx
files:
  - src/components/**/*.tsx
  - src/app/**/_components/**/*.tsx
ignores:
  - "**/*.test.tsx"
  - "**/*.stories.tsx"
severity: error
message: Base UI has no asChild; compose with the render prop instead.
note: |
  asChild is the Radix Slot API. Base UI replaces it with render, which takes an
  element or a function (props, state) => element
  (https://base-ui.com/react/handbook/composition).
  Example:
    <DialogTrigger render={<Button variant="outline" />}>Open</DialogTrigger>
rule:
  kind: jsx_attribute
  has:
    kind: property_identifier
    regex: ^asChild$
