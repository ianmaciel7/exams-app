id: no-as-child
language: tsx
files:
  - src/components/**/*.tsx
  - src/app/**/_components/**/*.tsx
ignores:
  - "**/*.test.tsx"
  - "**/*.stories.tsx"
  - src/components/ui/*.tsx
severity: error
message: Base UI composes elements through the render prop; asChild is a Radix API and is ignored here.
note: |
  Base UI (https://base-ui.com/react/handbook/composition) replaces the Radix
  asChild/Slot pattern with render. Pass the element to render instead.
  Example:
    <DialogTrigger render={<Button variant="outline" />}>Open</DialogTrigger>
rule:
  kind: jsx_attribute
  has:
    kind: property_identifier
    regex: ^asChild$
