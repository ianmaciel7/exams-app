id: no-base-ui-primitive-import
language: tsx
files:
  - src/components/**/*.tsx
  - src/app/**/_components/**/*.tsx
ignores:
  - "**/*.test.tsx"
  - "**/*.stories.tsx"
  - src/components/ui/*.tsx
severity: error
message: Import the wrapper from @/components/ui instead of a Base UI primitive; only use-render and merge-props may be imported directly.
note: |
  src/components/ui owns the Base UI primitives (styling, data-slot, sizes and
  touch targets). Owned components compose those wrappers. Use
  @base-ui/react/use-render and @base-ui/react/merge-props to build a render
  prop, as https://base-ui.com/react/utils/use-render describes.
rule:
  kind: import_statement
  has:
    field: source
    regex: ^.@base-ui/react
  not:
    has:
      field: source
      regex: ^.@base-ui/react/(use-render|merge-props).$
