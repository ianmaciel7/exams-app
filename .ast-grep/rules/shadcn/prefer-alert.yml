id: prefer-alert
language: tsx
files:
  - src/app/**/*.tsx
  - src/components/**/*.tsx
  - src/hooks/**/*.tsx
ignores:
  - "**/*.test.tsx"
  - "**/*.stories.tsx"
  - "src/components/ui/[!e]*.tsx"
  - "src/components/ui/e[!x]*.tsx"
  - src/components/ai-elements/**
  # Owned form primitives: Base UI Field.Error and the form-level error
  # render the role themselves.
  - src/components/ui/extensions/form-error.tsx
  - src/components/ui/extensions/form-field.tsx
severity: error
message: Render callouts and error messages with `Alert` from @/components/ui/alert instead of `role="alert"` on a div, p or span.
note: |
  shadcn/ui composition rule: callouts use `Alert` (`variant="destructive"`
  for errors) with `AlertTitle` and `AlertDescription`. It already sets
  `role="alert"`, so a hand-rolled `<p role="alert" className="text-destructive">`
  duplicates it and drifts from the theme. Field-level errors stay in
  `FormFieldError` and form-level errors in `FormError`.
rule:
  any:
    - kind: jsx_opening_element
    - kind: jsx_self_closing_element
  has:
    field: name
    regex: ^(div|p|span|section)$
  all:
    - has:
        kind: jsx_attribute
        all:
          - has:
              kind: property_identifier
              regex: ^role$
          - has:
              stopBy: end
              kind: string_fragment
              regex: ^alert$
