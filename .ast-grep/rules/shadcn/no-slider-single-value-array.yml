id: no-slider-single-value-array
language: tsx
files:
  - src/app/**/*.tsx
  - src/components/**/*.tsx
  - src/hooks/**/*.tsx
ignores:
  - "**/*.test.tsx"
  - "**/*.stories.tsx"
severity: error
message: "A single-thumb Slider takes a number; arrays are for range sliders."
note: |
  shadcn/ui base-vs-radix rule: <Slider defaultValue={50} /> in Base UI,
  <Slider defaultValue={[50]} /> in Radix.
rule:
  kind: jsx_attribute
  all:
    - has:
        kind: property_identifier
        regex: "^(value|defaultValue)$"
    - has:
        kind: jsx_expression
        regex: '^\{\s*\[[^,\]]*\]\s*\}$'
    - inside:
        stopBy: neighbor
        any:
          - kind: jsx_opening_element
          - kind: jsx_self_closing_element
        has:
          field: name
          regex: "^Slider$"
