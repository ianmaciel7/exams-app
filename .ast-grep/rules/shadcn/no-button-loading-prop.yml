id: no-button-loading-prop
language: tsx
files:
  - src/app/**/*.tsx
  - src/components/**/*.tsx
  - src/hooks/**/*.tsx
ignores:
  - "**/*.test.tsx"
  - "**/*.stories.tsx"
severity: error
message: "Button has no isPending, isLoading or loading prop; compose Spinner with data-icon and disabled."
note: |
  shadcn/ui rule. Example:
    <Button disabled={isPending} focusableWhenDisabled>
      {isPending ? <Spinner data-icon="inline-start" aria-hidden="true" /> : null}
      Save
    </Button>
rule:
  any:
    - kind: jsx_self_closing_element
    - kind: jsx_opening_element
  all:
    - has:
        field: name
        regex: "^Button$"
    - has:
        kind: jsx_attribute
        has:
          kind: property_identifier
          regex: "^(isPending|isLoading|loading)$"
