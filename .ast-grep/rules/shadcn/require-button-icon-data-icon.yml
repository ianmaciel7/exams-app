id: require-button-icon-data-icon
language: tsx
files:
  - src/app/**/*.tsx
  - src/components/**/*.tsx
  - src/hooks/**/*.tsx
ignores:
  - "**/*.test.tsx"
  - "**/*.stories.tsx"
severity: error
message: 'Icons next to text inside Button need data-icon="inline-start" or "inline-end".'
note: |
  shadcn/ui icons rule. Example:
    <Button><SearchIcon data-icon="inline-start" />Search</Button>
rule:
  kind: jsx_self_closing_element
  has:
    field: name
    regex: "(Icon|^Spinner)$"
  all:
    - not:
        has:
          kind: jsx_attribute
          has:
            kind: property_identifier
            regex: "^data-icon$"
    - inside:
        kind: jsx_element
        all:
          - has:
              field: open_tag
              has:
                field: name
                regex: "^Button$"
          # An icon-only Button (the label is an sr-only span) needs no placement.
          - has:
              any:
                - kind: jsx_text
                  regex: '\S'
                - kind: jsx_expression
