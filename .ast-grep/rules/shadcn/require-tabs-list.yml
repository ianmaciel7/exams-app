id: require-tabs-list
language: tsx
files:
  - src/app/**/*.tsx
  - src/components/**/*.tsx
  - src/hooks/**/*.tsx
ignores:
  - "**/*.test.tsx"
  - "**/*.stories.tsx"
severity: error
message: "TabsTrigger must be inside TabsList."
note: |
  shadcn/ui rule: TabsList provides the tablist role and keyboard roving.
rule:
  any:
    - kind: jsx_self_closing_element
    - kind: jsx_opening_element
  has:
    field: name
    regex: "^TabsTrigger$"
  all:
    # A wrapper component that returns TabsTrigger directly is not a call site.
    - inside:
        stopBy: end
        kind: jsx_element
    - not:
        inside:
          stopBy: end
          kind: jsx_element
          has:
            field: open_tag
            has:
              field: name
              regex: "^TabsList$"
