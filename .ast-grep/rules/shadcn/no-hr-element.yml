id: no-hr-element
language: tsx
files:
  - src/app/**/*.tsx
  - src/components/**/*.tsx
  - src/hooks/**/*.tsx
ignores:
  - "**/*.test.tsx"
  - "**/*.stories.tsx"
severity: error
message: "Use Separator instead of a raw hr element."
note: |
  shadcn/ui rule: Separator renders the correct role and orientation
  (https://ui.shadcn.com/docs/components/separator).
rule:
  any:
    - kind: jsx_self_closing_element
    - kind: jsx_opening_element
  has:
    field: name
    regex: "^hr$"
