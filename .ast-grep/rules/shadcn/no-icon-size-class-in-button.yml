id: no-icon-size-class-in-button
language: tsx
files:
  - src/app/**/*.tsx
  - src/components/**/*.tsx
  - src/hooks/**/*.tsx
ignores:
  - "**/*.test.tsx"
  - "**/*.stories.tsx"
severity: error
message: "Icons inside Button take their size from the component; remove size-*, w-* and h-* classes."
note: |
  shadcn/ui icons rule: Button sizes its icons through CSS. Use data-icon
  to position them.
rule:
  kind: jsx_self_closing_element
  has:
    field: name
    regex: "Icon$"
  all:
    - has:
        kind: jsx_attribute
        has:
          stopBy: end
          kind: string_fragment
          regex: '(^|[\s:!])(size|w|h)-[0-9.]+(\s|$)'
    - inside:
        stopBy: end
        kind: jsx_element
        has:
          field: open_tag
          has:
            field: name
            regex: "^Button$"
