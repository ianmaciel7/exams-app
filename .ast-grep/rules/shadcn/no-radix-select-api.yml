id: no-radix-select-api
language: tsx
files:
  - src/app/**/*.tsx
  - src/components/**/*.tsx
  - src/hooks/**/*.tsx
ignores:
  - "**/*.test.tsx"
  - "**/*.stories.tsx"
severity: error
message: "Radix Select API: use an items array with a { value: null } placeholder and alignItemWithTrigger on SelectContent."
note: |
  shadcn/ui base-vs-radix rule: SelectValue placeholder and SelectContent
  position are Radix props. Base UI puts the placeholder in items and aligns
  with alignItemWithTrigger.
rule:
  kind: jsx_attribute
  all:
    - has:
        kind: property_identifier
        regex: "^(placeholder|position)$"
    - inside:
        stopBy: neighbor
        any:
          - kind: jsx_opening_element
          - kind: jsx_self_closing_element
        has:
          field: name
          regex: "^(SelectValue|SelectContent)$"
