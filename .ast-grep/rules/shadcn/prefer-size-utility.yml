id: prefer-size-utility
language: tsx
files:
  - src/app/**/*.tsx
  - src/components/**/*.tsx
  - src/hooks/**/*.tsx
ignores:
  - "**/*.test.tsx"
  - "**/*.stories.tsx"
severity: error
message: "Use size-* when width and height are equal instead of w-* h-*."
note: |
  shadcn/ui styling rule: size-10 instead of w-10 h-10
  (https://ui.shadcn.com/docs). One utility cannot drift out of sync.
rule:
  kind: string_fragment
  regex: '(^|[\s:!])(w-0\s+h-0(\s|$)|h-0\s+w-0(\s|$)|w-0\.5\s+h-0\.5(\s|$)|h-0\.5\s+w-0\.5(\s|$)|w-1\s+h-1(\s|$)|h-1\s+w-1(\s|$)|w-1\.5\s+h-1\.5(\s|$)|h-1\.5\s+w-1\.5(\s|$)|w-2\s+h-2(\s|$)|h-2\s+w-2(\s|$)|w-2\.5\s+h-2\.5(\s|$)|h-2\.5\s+w-2\.5(\s|$)|w-3\s+h-3(\s|$)|h-3\s+w-3(\s|$)|w-3\.5\s+h-3\.5(\s|$)|h-3\.5\s+w-3\.5(\s|$)|w-4\s+h-4(\s|$)|h-4\s+w-4(\s|$)|w-5\s+h-5(\s|$)|h-5\s+w-5(\s|$)|w-6\s+h-6(\s|$)|h-6\s+w-6(\s|$)|w-7\s+h-7(\s|$)|h-7\s+w-7(\s|$)|w-8\s+h-8(\s|$)|h-8\s+w-8(\s|$)|w-9\s+h-9(\s|$)|h-9\s+w-9(\s|$)|w-10\s+h-10(\s|$)|h-10\s+w-10(\s|$)|w-11\s+h-11(\s|$)|h-11\s+w-11(\s|$)|w-12\s+h-12(\s|$)|h-12\s+w-12(\s|$)|w-14\s+h-14(\s|$)|h-14\s+w-14(\s|$)|w-16\s+h-16(\s|$)|h-16\s+w-16(\s|$)|w-20\s+h-20(\s|$)|h-20\s+w-20(\s|$)|w-24\s+h-24(\s|$)|h-24\s+w-24(\s|$)|w-28\s+h-28(\s|$)|h-28\s+w-28(\s|$)|w-32\s+h-32(\s|$)|h-32\s+w-32(\s|$)|w-36\s+h-36(\s|$)|h-36\s+w-36(\s|$)|w-40\s+h-40(\s|$)|h-40\s+w-40(\s|$)|w-44\s+h-44(\s|$)|h-44\s+w-44(\s|$)|w-48\s+h-48(\s|$)|h-48\s+w-48(\s|$)|w-52\s+h-52(\s|$)|h-52\s+w-52(\s|$)|w-56\s+h-56(\s|$)|h-56\s+w-56(\s|$)|w-60\s+h-60(\s|$)|h-60\s+w-60(\s|$)|w-64\s+h-64(\s|$)|h-64\s+w-64(\s|$)|w-72\s+h-72(\s|$)|h-72\s+w-72(\s|$)|w-80\s+h-80(\s|$)|h-80\s+w-80(\s|$)|w-96\s+h-96(\s|$)|h-96\s+w-96(\s|$)|w-px\s+h-px(\s|$)|h-px\s+w-px(\s|$)|w-full\s+h-full(\s|$)|h-full\s+w-full(\s|$))'
